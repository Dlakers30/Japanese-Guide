function escHtml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function hasJapanese(s){return /[\u3040-\u30ff\u3400-\u9fff\uff66-\uff9f]/.test(s);}
function hasKanji(s){return /[\u3400-\u9fff]/.test(s);}

// Kana -> romaji (used as a fallback when the translator returns no romaji)
const KANA_BASE={
  "あ":"a","い":"i","う":"u","え":"e","お":"o",
  "か":"ka","き":"ki","く":"ku","け":"ke","こ":"ko",
  "が":"ga","ぎ":"gi","ぐ":"gu","げ":"ge","ご":"go",
  "さ":"sa","し":"shi","す":"su","せ":"se","そ":"so",
  "ざ":"za","じ":"ji","ず":"zu","ぜ":"ze","ぞ":"zo",
  "た":"ta","ち":"chi","つ":"tsu","て":"te","と":"to",
  "だ":"da","ぢ":"ji","づ":"zu","で":"de","ど":"do",
  "な":"na","に":"ni","ぬ":"nu","ね":"ne","の":"no",
  "は":"ha","ひ":"hi","ふ":"fu","へ":"he","ほ":"ho",
  "ば":"ba","び":"bi","ぶ":"bu","べ":"be","ぼ":"bo",
  "ぱ":"pa","ぴ":"pi","ぷ":"pu","ぺ":"pe","ぽ":"po",
  "ま":"ma","み":"mi","む":"mu","め":"me","も":"mo",
  "や":"ya","ゆ":"yu","よ":"yo",
  "ら":"ra","り":"ri","る":"ru","れ":"re","ろ":"ro",
  "わ":"wa","を":"wo","ん":"n","ゔ":"vu",
  "ぁ":"a","ぃ":"i","ぅ":"u","ぇ":"e","ぉ":"o",
  "。":". ","、":", ","？":"?","！":"!","　":" ","「":"\"","」":"\""
};
const SMALL_Y={"ゃ":"a","ゅ":"u","ょ":"o"};
function kanaToRomaji(str){
  // convert katakana to hiragana first
  let s="";
  for(const ch of str){
    const code=ch.charCodeAt(0);
    s+=(code>=0x30A1&&code<=0x30F6)?String.fromCharCode(code-0x60):ch;
  }
  let out="",doubleNext=false;
  const chars=[...s];
  for(let i=0;i<chars.length;i++){
    const ch=chars[i],next=chars[i+1];
    if(ch==="っ"){doubleNext=true;continue;}
    if(ch==="ー"){const m=out.match(/[aeiou](?=[^aeiou]*$)/);out+=m?m[0]:"";continue;}
    let r=KANA_BASE[ch];
    if(r===undefined){out+=ch;doubleNext=false;continue;}
    if(next && SMALL_Y[next] && r.endsWith("i") && r.length>1){
      if(r==="shi")r="sh"+SMALL_Y[next];
      else if(r==="chi")r="ch"+SMALL_Y[next];
      else if(r==="ji")r="j"+SMALL_Y[next];
      else r=r.slice(0,-1)+"y"+SMALL_Y[next];
      i++;
    }
    if(doubleNext){out+=(r.startsWith("ch")?"t":r[0]);doubleNext=false;}
    out+=r;
  }
  return out.replace(/\s+/g," ").trim();
}

async function fetchWithTimeout(url,ms){
  const ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
  const t=setTimeout(()=>{if(ctrl)ctrl.abort();},ms);
  try{return await fetch(url,ctrl?{signal:ctrl.signal}:{});}
  finally{clearTimeout(t);}
}
async function translateViaGoogle(text,sl,tl){
  const url="https://translate.googleapis.com/translate_a/single?client=gtx&sl="+sl+"&tl="+tl+"&dt=t&dt=rm&q="+encodeURIComponent(text);
  const res=await fetchWithTimeout(url,8000);
  if(!res.ok)throw new Error("google "+res.status);
  const data=await res.json();
  const segs=(data&&data[0])||[];
  let translated="",targetRom="",sourceRom="";
  segs.forEach(s=>{
    if(!Array.isArray(s))return;
    if(s[0])translated+=s[0];
    else{if(s[2])targetRom=s[2];if(s[3])sourceRom=s[3];}
  });
  if(!translated)throw new Error("empty");
  return {translated,targetRom,sourceRom};
}
async function translateViaMyMemory(text,sl,tl){
  const url="https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+sl+"|"+tl;
  const res=await fetchWithTimeout(url,8000);
  if(!res.ok)throw new Error("mymemory "+res.status);
  const data=await res.json();
  const t=data&&data.responseData&&data.responseData.translatedText;
  if(!t)throw new Error("empty");
  return {translated:t,targetRom:"",sourceRom:""};
}

function renderTranslateTab(){

function trKeydown(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();runTranslate();}

async function runTranslate(){
  const input=document.getElementById("trInput");
  const out=document.getElementById("trResult");
  const btn=document.getElementById("trBtn");
  const text=input.value.trim();
  if(!text){out.innerHTML="";return;}
  if(typeof navigator!=="undefined"&&navigator.onLine===false){
    out.innerHTML='<div class="tr-error">You appear to be offline. Translation needs internet - your Saved Phrases still work offline.</div>';
    return;
  }
  const jpToEn=hasJapanese(text);
  const sl=jpToEn?"ja":"en",tl=jpToEn?"en":"ja";
  const myId=++translateRequestId;
  out.innerHTML='<div class="tr-loading">Translating...</div>';
  btn.disabled=true;
  let r=null;
  try{r=await translateViaGoogle(text,sl,tl);}
  catch(e){try{r=await translateViaMyMemory(text,sl,tl);}catch(e2){r=null;}}
  if(myId!==translateRequestId)return; // a newer request replaced this one
  btn.disabled=false;
  if(!r){
    out.innerHTML='<div class="tr-error">Couldn\'t reach the translation service. Check your connection and try again.</div>';
    return;
  }
  let jp,en,rom;
  if(jpToEn){jp=text;en=r.translated;rom=r.sourceRom;}
  else{jp=r.translated;en=text;rom=r.targetRom;}
  if(!rom&&!hasKanji(jp))rom=kanaToRomaji(jp);
  currentTranslation={jp,en,rom,dir:jpToEn?"ja-en":"en-ja"};
  renderTranslationResult();
}

// Saved phrases storage
function loadSaved(){
  try{const raw=localStorage.getItem(K.saved);const a=raw?JSON.parse(raw):[];return Array.isArray(a)?a:[];}
  catch(e){return [];}
}
function saveSavedList(list){

}
function addSavedPhrase(item){
  const list=loadSaved();
  if(list.some(s=>s.jp===item.jp))return "dup";
  list.unshift({
    id:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    jp:item.jp,en:item.en,rom:item.rom||"",note:item.note||"",created:Date.now()
  });
  return saveSavedList(list)?"ok":"fail";
}
function deleteSavedPhrase(id){
  if(!confirm("Remove this phrase from Saved Phrases?"))return;
  saveSavedList(loadSaved().filter(s=>s.id!==id));
  renderSavedTab();
  buildSearchIndex();
  if(currentTranslation)renderTranslationResult();
}

// ── Highlight markup: [particle] {grammar} ──────────────────────────
function hlMarkup(s){
  return String(s).replace(/\[([^\]]+)\]/g,'<span class="hl-p">$1</span>').replace(/\{([^}]+)\}/g,'<span class="hl-g">$1</span>');
}
function stripMarkup(s){return String(s).replace(/[\[\]{}]/g,"");}
function normalizeLessonMarkup(){
  units.forEach(u=>(u.sections||[]).forEach(sec=>(sec.phrases||[]).forEach(p=>{
    if(p.jp&&/[\[\]{}]/.test(p.jp)){p.hl=hlMarkup(p.jp);p.jp=stripMarkup(p.jp);}
  })));
}

// ── Lesson section renderer ─────────────────────────────────────────
const PARTICLE_SET=["は","が","を","に","で","の","と","も","へ","から","まで","より","か","ね","よ","や"];
function formulaClass(p){
  const s=p.trim();
  if(PARTICLE_SET.indexOf(s)!==-1)return "f-particle";
  if(/^Verb/i.test(s)||/^Main verb/i.test(s))return "f-verb";
  if(/^(い-adj|な-adj|Adj)/i.test(s))return "f-adj";
  if(/^Time/i.test(s))return "f-time";
  if(/^[A-Za-z]/.test(s))return "f-noun";
  return "f-grammar";
}
function renderFormula(f){
  const groups=f.split(/\s{2}\/\s{2}/);
  return groups.map(g=>{
    const parts=g.split(" + ");
    return `<div class="formula">${parts.map((p,i)=>`<span class="f-chip ${formulaClass(p)}">${p}</span>${i<parts.length-1?'<span class="f-plus">+</span>':""}`).join("")}</div>`;
  }).join("");
}
function tableCell(c){
  const parts=String(c).split("|");
  const main=hlMarkup(parts[0]);
  return parts[1]?`<div class="lt-jp">${main}</div><div class="lt-rom">${parts[1]}</div>`:`<div class="lt-plain">${main}</div>`;
}

}
function renderLessonSection(sec,unitId){
  let h=`<div class="lesson">`;

  if(sec.formula)h+=`<div class="lesson-label">Pattern</div>${renderFormula(sec.formula)}`;

    pastneg:[word+"じゃなかった",word+"じゃありませんでした"],te:[word+"で",null],adv:[word+"に",null],noun:[word+"な 〜",null],naru:[word+"になる",word+"になります"]}[form];
  return {plain:f[0],polite:f[1]};
}
function adjRule(a,form){
  if(a.t==="i"){
    if(a.irr&&form!=="pres"&&form!=="noun")return "Irregular: いい switches to よ for every form except the present.";
    return {pres:"い-adjective: stays as is.",neg:"Drop い, add くない.",past:"Drop い, add かった.",pastneg:"Drop い, add くなかった.",
      te:"Drop い, add くて.",adv:"Drop い, add く.",noun:"い-adjectives go straight before a noun.",naru:"Drop い, add く, then なる."}[form];
  }
  const trap=a.trap?" (Ends in い, but it's a な-adjective!)":"";
  return {pres:"な-adjective: add だ / です.",neg:"Add じゃない / じゃありません.",past:"Add だった / でした.",pastneg:"Add じゃなかった / じゃありませんでした.",
    te:"Add で.",adv:"Add に.",noun:"Add な before a noun.",naru:"Add に, then なる."}[form]+trap;
}

function conjOptionsHtml(filter){
  const f=(filter||"").trim().toLowerCase();
  const match=(w)=>!f||w.en.toLowerCase().indexOf(f)!==-1||w.r.indexOf(f)!==-1||w.k.indexOf(f)!==-1||kanaToRomaji(w.r).indexOf(f)!==-1;
  const groups=[
    ["Group 1 verbs (う-verbs)",VERBS.map((v,i)=>[v,"v"+i]).filter(x=>x[0].g===1)],
    ["Group 2 verbs (る-verbs)",VERBS.map((v,i)=>[v,"v"+i]).filter(x=>x[0].g===2)],
    ["Group 3 verbs (irregular)",VERBS.map((v,i)=>[v,"v"+i]).filter(x=>x[0].g===3)],
    ["い-adjectives",ADJS.map((a,i)=>[a,"a"+i]).filter(x=>x[0].t==="i")],
    ["な-adjectives",ADJS.map((a,i)=>[a,"a"+i]).filter(x=>x[0].t==="na")]
  ];
  let h="";
  groups.forEach(([label,items])=>{
    const m=items.filter(x=>match(x[0]));
    if(!m.length)return;
    h+=`<optgroup label="${label}">${m.map(x=>`<option value="${x[1]}">${x[0].k}${x[0].k!==x[0].r?" ("+x[0].r+")":""} - ${x[0].en}</option>`).join("")}</optgroup>`;
  });
  return h;
}
function filterConjugator(){

function showConjugation(){

function sbVerbPhrase(v,form){
  const c=f=>conjVerb(v,f);
  switch(form){
    case "teimasu":{const t=c("te");return {jp:t.kana+"います",rom:t.rom+" imasu",core:"te"};}
    case "keiken":{const t=c("ta");return {jp:t.kana+" ことが あります",rom:t.rom+" koto ga arimasu",core:"ta"};}
    case "tai":{const t=c("tai");return {jp:t.kana+"です",rom:t.rom+" desu",core:"tai"};}
    case "masenka":{const t=c("masen");return {jp:t.kana+"か",rom:t.rom+" ka",core:"masenka"};}
    default:{const t=c(form);return {jp:t.kana,rom:t.rom,core:form};}
  }
}
function sbEnglish(subj,when,d,objEn,whereEn,form){
  const e=d.en,third=!!subj.third,fut=when.t==="future";
  let vp,subjOut=subj.en,q=false;
  switch(form){
    case "masu":case "dict":vp=fut?"will "+e.b:(third?e.s:e.b);break;
    case "masen":case "nai":vp=fut?"won't "+e.b:(third?"doesn't ":"don't ")+e.b;break;
    case "mashita":case "ta":vp=e.p;break;
    case "masendeshita":vp="didn't "+e.b;break;
    case "tai":vp=(third?"wants to ":"want to ")+e.b;break;
    case "mashou":subjOut="Let's";vp=e.b;break;
    case "masenka":subjOut="Would you like to";vp=e.b;q=true;break;
    case "teimasu":vp=(third?"is ":"am ")+e.ing;break;
    case "keiken":vp=(third?"has ":"have ")+e.pp;break;
  }
  let s=subjOut+" "+vp;
  if(objEn)s+=" "+objEn;
  if(whereEn)s+=" "+whereEn;
  if(form==="keiken")s+=" before";
  else if(when.en)s+=" "+when.en;
  s=s.replace(/\s+/g," ").trim();
  return s.charAt(0).toUpperCase()+s.slice(1)+(q?"?":".");
}
let sbCurrent=null;
function updateBuilder(){
  const subj=SB_WHO[+document.getElementById("sbWho").value];
  const when=SB_WHEN[+document.getElementById("sbWhen").value];
  const {d,v}=sbVerbDef(+document.getElementById("sbVerb").value);
  const obj=d.slot!=="none"?d.opts[+document.getElementById("sbObj").value||0]:null;
  const where=d.place?SB_WHERE[+document.getElementById("sbWhere").value]:SB_WHERE[0];
  const form=SB_FORMS[+document.getElementById("sbForm").value].id;
  const blocks=[],why=[],warns=[];
  if(subj.jp){blocks.push({cls:"topic",jp:subj.jp,rom:kanaToRomaji(subj.jp),p:"は",prom:"wa"});why.push("<b>は</b> marks the topic: who the sentence is about.");}
  if(when.jp){
    blocks.push({cls:"time",jp:when.jp,rom:when.rom||kanaToRomaji(when.jp),p:when.ni?"に":"",prom:when.ni?"ni":""});
    why.push(when.ni?"<b>に</b> after a specific clock time (7じに = at 7:00).":"No particle after "+when.jp+": relative time words (today, tomorrow, every day) never take one.");
  }
  if(where.jp){blocks.push({cls:"place",jp:where.jp,rom:kanaToRomaji(where.jp),p:"で",prom:"de"});why.push("<b>で</b> marks where the action takes place.");}
  if(obj){
    const p={obj:"を",dest:"に",person:"に"}[d.slot],pr={obj:"wo",dest:"ni",person:"ni"}[d.slot];
    blocks.push({cls:"obj",jp:obj[0],rom:kanaToRomaji(obj[0]),p,prom:pr});
    why.push({obj:"<b>を</b> marks the object: the thing the action is done to.",dest:"<b>に</b> marks the destination you go to.",person:"<b>に</b> marks the person you meet. あう takes に, not を."}[d.slot]);
  }
  const vp=sbVerbPhrase(v,form);
  blocks.push({cls:"verb",jp:vp.jp,rom:vp.rom,p:"",prom:""});
  why.push("The verb always comes last. Form used: <b>"+SB_FORMS.find(f=>f.id===form).label+"</b>.");
  const pastForms=["mashita","masendeshita","ta"],nonPast=["masu","masen","dict","nai","tai","mashou","masenka","teimasu"];
  if(when.t==="past"&&nonPast.indexOf(form)!==-1)warns.push(when.jp+" is in the past. Use a past form like 〜ました or 〜ませんでした.");
  if(when.t==="future"&&pastForms.indexOf(form)!==-1)warns.push(when.jp+" is in the future. Japanese uses the ます (present) form for the future.");
  if(form==="tai"&&subj.third)warns.push("たい is only used for your own wants. For other people, say 〜たがっています (e.g. いきたがっています).");
  if((form==="mashou"||form==="masenka")&&subj.jp)warns.push("Invitations usually drop the subject. Try '(no subject)'.");
  if(form==="keiken"&&when.jp)warns.push("たことがあります is about life experience, so it doesn't take a specific time. Use 〜ました for a specific time.");
  if(form==="teimasu"&&when.t)warns.push("〜ています here means 'is doing right now', which doesn't fit "+when.jp+".");
  if(["dict","ta","nai"].indexOf(form)!==-1)why.push("Casual form: use it with friends and family, not with staff or strangers.");
  const jp=blocks.map(b=>b.jp+(b.p?b.p:"")).join(" ")+"。";
  let rom=blocks.map(b=>b.rom+(b.prom?" "+b.prom:"")).join(" ");
  rom=rom.charAt(0).toUpperCase()+rom.slice(1)+(form==="masenka"?"?":".");
  const en=sbEnglish(subj,when,d,obj?obj[1]:"",where.en,form);
  sbCurrent={jp,en,rom};
  let h=`<div class="sb-blocks">${blocks.map(b=>`<div class="sb-block ${b.cls}"><span class="sb-word">${b.jp}</span>${b.p?`<span class="sb-particle">${b.p}</span>`:""}</div>`).join("")}</div>
    <div class="sb-result">
      <div class="sb-jp">${jp}</div>
      <div class="sb-rom">${rom}</div>
      <div class="sb-en">${en}</div>
      <div class="sb-actions">
        <button class="tr-listen" onclick="speakPhrase(sbCurrent.jp,sbCurrent.en,null)">&#9654; Listen</button>
        <button class="tr-listen slow" onclick="sbSave()">&#9733; Save phrase</button>
      </div>
      <div id="sbSaveMsg" class="sb-savemsg"></div>
    </div>`;
  if(warns.length)h+=warns.map(w=>`<div class="sb-warn"><b>Check this:</b> ${w}</div>`).join("");
  h+=`<div class="sb-why"><div class="lesson-label">Why it's built this way</div><ul>${why.map(w=>`<li>${w}</li>`).join("")}</ul></div>`;
  document.getElementById("sbOut").innerHTML=h;
}

  if(!sbCurrent)return;

const DRILL_VERB_FORMS=["masu","masen","mashita","masendeshita","nai","ta","nakatta","te","tai","potential","volitional","ba","tara","passive","causative"];
const DRILL_DEFAULT=["masu","masen","mashita","te","nai","ta"];
let drillState=null;
function normAnswer(s){
  s=String(s||"").trim().toLowerCase();
  if(hasJapanese(s))s=kanaToRomaji(s.replace(/\s/g,""));
  s=s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"");
  s=s.replace(/sy/g,"sh").replace(/ty/g,"ch").replace(/(zy|jy)/g,"j").replace(/zi/g,"ji").replace(/ti/g,"chi").replace(/tu/g,"tsu").replace(/(^|[^sc])hu/g,"$1fu").replace(/(^|[^s])si/g,"$1shi").replace(/cch/g,"tch");
  s=s.replace(/ou/g,"o").replace(/oo/g,"o").replace(/uu/g,"u").replace(/aa/g,"a").replace(/ii/g,"i").replace(/ee/g,"e").replace(/nn/g,"n");
  return s;
}
function renderDrillTab(){
  const div=document.getElementById("unit-drill");
  if(!div)return;
  const chip=(id,label,on,group)=>`<button class="dr-chip${on?" active":""}" data-g="${group}" data-v="${id}" onclick="this.classList.toggle('active')">${label}</button>`;
  div.innerHTML=`<div class="unit-title">Conjugation Drill</div>

      </div>
      <div id="drVerbOpts">

        <div class="lesson-label">Forms</div>
        <div class="dr-chips">${DRILL_VERB_FORMS.map(id=>{const f=VERB_FORMS.find(x=>x.id===id);return chip(id,f.label+" ("+f.sub+")",DRILL_DEFAULT.indexOf(id)!==-1,"vf");}).join("")}</div>
      </div>

        <div class="lesson-label">Forms</div>

      </div>
      <div class="lesson-label">Questions</div>
      <div class="quiz-count-group">${[10,20,30].map(n=>`<button class="quiz-count-btn${n===10?" active":""}" data-count="${n}" onclick="document.querySelectorAll('#unit-drill .quiz-count-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active')">${n}</button>`).join("")}</div>
      <button class="quiz-start-btn" onclick="startDrill()">Start Drill</button>

function setDrillMode(btn){
  document.querySelectorAll("#unit-drill .quiz-toggle-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  const verb=btn.dataset.m==="verb";
  document.getElementById("drVerbOpts").style.display=verb?"":"none";
  document.getElementById("drAdjOpts").style.display=verb?"none":"";
}
function drillChips(g){return [...document.querySelectorAll('#unit-drill .dr-chip.active[data-g="'+g+'"]')].map(b=>b.dataset.v);}
function startDrill(){
  const mode=document.querySelector("#unit-drill .quiz-toggle-btn.active").dataset.m;
  const count=+document.querySelector("#unit-drill .quiz-count-btn.active").dataset.count;
  const pool=[];
  if(mode==="verb"){
    const groups=drillChips("vg").map(Number),forms=drillChips("vf");
    VERBS.forEach(v=>{if(groups.indexOf(v.g)===-1)return;forms.forEach(f=>{const r=conjVerb(v,f);if(r)pool.push({kind:"v",w:v,f,ans:[r],rule:verbRule(v,f),label:VERB_FORMS.find(x=>x.id===f)});});});
  } else {
    const types=drillChips("at"),forms=drillChips("af");
    ADJS.forEach(a=>{if(types.indexOf(a.t)===-1)return;forms.forEach(f=>{
      const kana=conjAdjWord(a.r,a,f),kanji=a.k===a.r?kana:conjAdjWord(a.k,a,f);
      const ans=[{kana:kana.plain,kanji:kanji.plain,rom:kanaToRomaji(kana.plain)}];
      if(kana.polite)ans.push({kana:kana.polite,kanji:kanji.polite,rom:kanaToRomaji(kana.polite)});
      if(a.t==="na"&&(f==="neg"||f==="pastneg"))ans.push({kana:kana.plain.replace("じゃ","では"),kanji:kanji.plain.replace("じゃ","では"),rom:""});
      pool.push({kind:"a",w:a,f,ans,rule:adjRule(a,f),label:ADJ_FORMS.find(x=>x.id===f)});
    });});
  }
  const area=document.getElementById("drArea");
  if(!pool.length){area.innerHTML='<div class="tr-error">Pick at least one group and one form.</div>';return;}
  drillState={qs:shuffleArr(pool).slice(0,count),i:0,score:0,missed:[]};
  renderDrillQ();
  if(typeof area.scrollIntoView==="function")area.scrollIntoView({behavior:"smooth",block:"start"});
}
function renderDrillQ(){
  const s=drillState,q=s.qs[s.i],area=document.getElementById("drArea");
  const formName=q.kind==="v"?q.label.label+" ("+q.label.sub+")":q.label.label;
  area.innerHTML=`<div class="quiz-progress">Question ${s.i+1} of ${s.qs.length} · Score ${s.score}</div>
    <div class="quiz-prompt-card">
      <div class="quiz-prompt-label">Conjugate to: ${formName}</div>
      <div class="quiz-prompt-main quiz-jp">${q.w.k}</div>
      <div class="dr-sub">${q.w.k!==q.w.r?q.w.r+" · ":""}<span class="rom-inline">${kanaToRomaji(q.w.r)} · </span>${q.w.en}</div>
    </div>
    <input id="drInput" class="tool-input dr-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type in hiragana or romaji" onkeydown="if(event.key==='Enter'){event.preventDefault();checkDrill();}">
    <div class="dr-btns">
      <button class="quiz-secondary-btn" onclick="checkDrill(true)">Show answer</button>
      <button class="quiz-start-btn" onclick="checkDrill()">Check</button>
    </div>
    <div id="drFb"></div>`;
  const inp=document.getElementById("drInput");
  if(inp&&typeof inp.focus==="function")inp.focus();
}
function checkDrill(reveal){
  const s=drillState;
  if(!s||s.answered)return;
  const q=s.qs[s.i];
  const raw=(document.getElementById("drInput").value||"").trim();
  if(!raw&&!reveal)return;
  const user=raw.replace(/\s/g,"");
  const ok=!reveal&&q.ans.some(a=>user===a.kana||user===a.kanji||normAnswer(user)===normAnswer(a.kana));
  s.answered=true;
  if(ok)s.score++;else s.missed.push(q);
  const a=q.ans[0];
  document.getElementById("drFb").innerHTML=`<div class="dr-fb ${ok?"good":"bad"}">
      <div class="dr-fb-title">${ok?"Correct!":(reveal?"Answer:":"Not quite. Answer:")}</div>
      <div class="dr-fb-ans">${a.kanji}${a.kanji!==a.kana?` <span class="dr-fb-kana">(${a.kana})</span>`:""} <button class="quiz-fb-play" onclick="speakPhrase('${esc(a.kana)}','',this)">&gt;&gt;</button></div>
      <div class="dr-fb-rom">${a.rom}${q.ans[1]&&q.ans[1].rom?" · also: "+q.ans[1].kana:""}</div>
      <div class="dr-fb-rule">${q.rule}</div>
    </div>
    <button class="quiz-next-btn" onclick="nextDrill()">${s.i>=s.qs.length-1?"See results":"Next"}</button>`;
}
function nextDrill(){
  const s=drillState;
  s.answered=false;s.i++;
  if(s.i<s.qs.length){renderDrillQ();return;}
  const pct=Math.round(s.score/s.qs.length*100);
  let h=`<div class="quiz-result-card"><div class="quiz-result-score">${s.score} / ${s.qs.length}</div><div class="quiz-result-pct">${pct}%</div>`;
  if(s.missed.length){
    h+=`<div class="dr-missed"><div class="lesson-label">Review these</div>${s.missed.map(q=>{const a=q.ans[0];return `<div class="dr-miss-row"><span>${q.w.k} → ${q.kind==="v"?q.label.label:q.label.label}</span><b>${a.kanji}</b></div>`;}).join("")}</div>`;
  } else h+=`<div class="quiz-result-msg">Perfect! Try adding more forms.</div>`;
  h+=`<button class="quiz-start-btn" onclick="retryDrill()">Drill again</button></div>`;
  document.getElementById("drArea").innerHTML=h;
}
function retryDrill(){
  const s=drillState;
  const base=s.missed.length?s.missed.concat(shuffleArr(s.qs).slice(0,Math.max(0,s.qs.length-s.missed.length))):s.qs;
  drillState={qs:shuffleArr(base),i:0,score:0,missed:[]};
  renderDrillQ();
}

// ── Old-tab star migration ──────────────────────────────────────────
function migrateOrphanStars(){
  const ids=new Set(units.map(u=>u.id));
  const stars=loadStars(),keep=[],moved=[];
  stars.forEach(s=>(ids.has(s.unitId)?keep:moved).push(s));
  if(!moved.length)return;
  moved.forEach(s=>addSavedPhrase({jp:s.jp,en:s.en,rom:s.rom,note:"Starred in the old Grammar tab"}));
  saveStars(keep);
}

// ═══════════════════════════════════════════════════════════════
// Quiz v3: multi-topic chips with subgroups, bigger counts, mixed
// direction, misses + retry (ported from the N5 guide)
// ═══════════════════════════════════════════════════════════════
const JP_RE=/[぀-ヿ一-龯]/;
const QUIZ_EXCLUDE=["home","quiz","translate","saved","recorder","conjugator","builder","drill"];
const QUIZ_GROUPS=NAV_GROUPS
  .map(g=>({name:g.name,ids:g.ids.filter(id=>QUIZ_EXCLUDE.indexOf(id)<0)}))
  .filter(g=>g.ids.length)
  .concat([{name:"Your review",ids:["__starred","saved"]}]);
const SPECIAL_TOPICS={
  __starred:{label:"Starred items",build:()=>loadStars().map(s=>({jp:s.jp,en:s.en||s.rom||"",rom:s.rom||"",sub:"From "+topicLabel(s.unitId)})).filter(x=>x.jp&&x.en&&x.jp.indexOf("→")===-1)}
};
function quizItemOk(jp,en){return jp&&en&&JP_RE.test(jp)&&jp.indexOf("→")===-1&&jp.length<=45&&en.length<=80&&jp!==en;}
function collectQuizItemsFromUnit(u){
  const out=[];
  (u.sections||[]).forEach(sec=>{
    if(sec.header)return;
    const sub=sec.title||"Other";
    (sec.phrases||[]).forEach(p=>{
      const en=p.en||p.rom||"";
      if(quizItemOk(p.jp,en))out.push({jp:p.jp,en:en,rom:p.rom||"",sub:sub});
    });
    if(sec.table&&sec.table.speak!==undefined&&sec.table.en!==undefined){
      sec.table.rows.forEach(r=>{
        const c=String(r[sec.table.speak]).split("|"),jp=stripMarkup(c[0]),en=stripMarkup(String(r[sec.table.en]).split("|")[0]);
        if(quizItemOk(jp,en))out.push({jp:jp,en:en,rom:c[1]||"",sub:sub});
      });
    }
    if(sec.kosoado){
      sec.kosoado.rows.forEach(row=>sec.kosoado.columns.forEach(col=>{const x=row.cells[col.key];if(x&&quizItemOk(x.jp,x.en))out.push({jp:x.jp,en:x.en,rom:x.rom||"",sub:sub});}));
    }
  });
  return out;
}
function kanaItemsWithRows(){
  const rowOf=r=>{if(/^[aiueo]$/.test(r))return "a";if(r==="n"||/^w/.test(r))return "w";if(/^(sh|s)/.test(r))return "s";if(/^(ch|ts|t)/.test(r))return "t";if(/^(f|h)/.test(r))return "h";return r[0];};
  const items=KANA_QUIZ_ITEMS.map(k=>({jp:k.c,en:k.r,rom:k.r,_g:k.g||"",_s:/[\u3041-\u309f]/.test(k.c)?"Hiragana":"Katakana",_r:rowOf(k.r)}));
  const chars={};items.forEach(it=>{if(it._g)return;const key=it._s+"|"+it._r;(chars[key]=chars[key]||[]).push(it.jp);});
  items.forEach(it=>{it.sub=it._g||(it._s+": "+chars[it._s+"|"+it._r].join(" "));delete it._s;delete it._r;delete it._g;});
  return items;
}
function topicItems(id){
  if(SPECIAL_TOPICS[id])return SPECIAL_TOPICS[id].build();
  if(id==="saved")return loadSaved().map(s=>({jp:s.jp,en:s.en,rom:s.rom||"",sub:"Saved phrases"})).filter(x=>x.jp&&x.en);
  if(id==="kana")return kanaItemsWithRows();
  const u=units.find(x=>x.id===id);
  return u?collectQuizItemsFromUnit(u):[];
}
function topicLabel(id){
  if(SPECIAL_TOPICS[id])return SPECIAL_TOPICS[id].label;
  if(id==="saved")return "Saved phrases";
  const u=units.find(x=>x.id===id);
  return u?u.tab:id;
}
function itemKey(it){return it.fixed?it.key:(it.jp+"|"+it.en);}
function dedupeQuizItems(items){
  const seen=new Set(),out=[];
  items.forEach(it=>{const k=itemKey(it);if(!seen.has(k)){seen.add(k);out.push(it);}});
  return out;
}
function buildQuizPool(ids,excl){
  if(typeof ids==="string")ids=ids==="all"?QUIZ_GROUPS.flatMap(g=>g.ids):[ids];
  excl=excl||{};
  let items=[];
  ids.forEach(id=>{const ex=excl[id]||[];items=items.concat(topicItems(id).filter(it=>ex.indexOf(it.sub)<0));});
  return dedupeQuizItems(items);
}
let _globalBank=null;
function globalBank(){
  if(!_globalBank)_globalBank=dedupeQuizItems(units.flatMap(u=>QUIZ_EXCLUDE.indexOf(u.id)>=0?[]:(u.id==="kana"?topicItems("kana"):collectQuizItemsFromUnit(u))));
  return _globalBank;
}

function topicItemsCached(id){if(!_tiCache[id])_tiCache[id]=topicItems(id);return _tiCache[id];}
function topicSubs(id){
  const order=[],counts={};
  topicItemsCached(id).forEach(it=>{const s=it.sub||"Other";if(!(s in counts)){counts[s]=0;order.push(s);}counts[s]++;});
  return order.map(s=>({name:s,n:counts[s]}));
}
function topicSelCount(id){const ex=quizSel.excl[id]||[];return topicItemsCached(id).filter(it=>ex.indexOf(it.sub||"Other")<0).length;}
function currentQuizPrefs(){return {topics:quizSel.topics.slice(),excl:JSON.parse(JSON.stringify(quizSel.excl)),dir:quizSel.dir,count:quizSel.count};}

function renderQuizTopics(){

function qzTapTopic(id){

    if(topicSubs(id).every(s=>ex.indexOf(s.name)>=0))delete quizSel.excl[id];

function qzTogglePanel(id){

function qzToggleSub(id,si){

function updateQuizAvail(){

function quizLabelFor(ids,excl){
  excl=excl||{};

    const ex=excl[id]||[];
    if(!ex.length)return topicLabel(id);
    const inc=topicSubs(id).filter(s=>ex.indexOf(s.name)<0).map(s=>s.name);
    return topicLabel(id)+(inc.length===1?": "+inc[0]:" ("+inc.length+" sections)");
  });

function startQuiz(opts){
  stopAll();

  if(!opts)saveQuizPrefs(p);
  if(!opts)p.topics=p.topics.filter(id=>topicSelCount(id)>0);
  const pool=p.pool||buildQuizPool(p.topics,p.excl);
  if(!pool.length){alert("Tick at least one topic with questions.");return;}
  const shuffled=shuffleArr(p.only||pool);
  const total=p.count==="all"?shuffled.length:Math.min(parseInt(p.count,10),shuffled.length);
  quizState={
    topics:p.topics,excl:p.excl,topicLabel:p.label||quizLabelFor(p.topics,p.excl),direction:p.dir,count:p.count,
    pool:pool,questions:shuffled.slice(0,total),index:0,score:0,answered:false,missed:[]

// Wrong answers: same topic first, then the whole guide. Never offer a second
// option that would also be correct (あ / ア for "a", or two meanings of one word).
function _normTxt(s){return String(s||"").trim().toLowerCase();}
function makeOptions(item,isEnToJp){
  const correctText=isEnToJp?item.jp:item.en;
  const seen=new Set([_normTxt(correctText)]);
  const ds=[];
  const tryFrom=list=>{for(const o of shuffleArr(list)){
    if(ds.length>=3)break;
    if(o.fixed||o===item)continue;
    if(isEnToJp?_normTxt(o.en)===_normTxt(item.en):o.jp===item.jp)continue;
    const t=(isEnToJp?o.jp:o.en).trim();const k=_normTxt(t);
    if(!t||seen.has(k))continue;seen.add(k);ds.push(t);}};
  tryFrom(quizState.pool);
  if(ds.length<3)tryFrom(globalBank());
  return {options:shuffleArr([correctText].concat(ds)),correctText:correctText};
}
function renderQuizQuestion(){
  const div=document.getElementById("unit-quiz");

    options=shuffleArr([item.correct].concat(item.wrong));promptJp=true;
  } else {
    const isEnToJp=qs.direction==="mixed"?Math.random()<0.5:qs.direction==="en-jp";
    const o=makeOptions(item,isEnToJp);
    options=o.options;correctText=o.correctText;
    label=isEnToJp?"English &rarr; Japanese":"Japanese &rarr; English";
    promptHtml=escHtml(isEnToJp?item.en:item.jp);promptJp=!isEnToJp;
  }
  qs.currentOptions=options;qs.currentCorrectIndex=options.indexOf(correctText);qs.currentItem=item;qs.answered=false;
  const optJp=JP_RE.test(correctText);
  let html=`<div class="quiz-progress">Question ${qs.index+1} of ${qs.questions.length} &middot; ${escHtml(qs.topicLabel)} &middot; Score ${qs.score}</div>
  <div class="quiz-prompt-card"><div class="quiz-prompt-label">${label}</div>
    <div class="quiz-prompt-main${promptJp&&!item.fixed?" quiz-jp":""}${item.fixed?" qz-fixed":""}">${promptHtml}</div></div>
  <div class="quiz-options" id="quizOptions">`;

  html+=`</div><div class="quiz-feedback" id="quizFeedback"></div><div id="quizNextWrap"></div>

  div.innerHTML=html;
}

function selectQuizAnswerBase(i){

function showQuizResultsBase(){

      <button class="${qs.missed.length?"quiz-secondary-btn":"quiz-start-btn"}" onclick="retryQuiz()">New round, same topics</button>
      <button class="quiz-secondary-btn" onclick="renderQuizTab()">Change topics</button>

function showQuizResults(){
  showQuizResultsBase();
  const qs=quizState,card=document.querySelector("#unit-quiz .quiz-result-card");
  if(!qs)return;
  qs._done=true;
  if(card){
    let note="";

      let up=0,reset=0;
      qs.questions.slice(0,qs.index+(qs.answered?1:0)).forEach(it=>{const k=itemKey(it),a=after[k],b=before[k];if(a&&b){if(a.b>b.b)up++;else if(a.b===1&&a.l>((b&&b.l)||0))reset++;}});
      const st=srsStats();
      note=`${up} moved up the schedule${reset?`, ${reset} back to the start`:""}. ${st.due?st.due+" still due.":"Nothing else due"+(st.next?" - next review "+fmtWhen(st.next):"")+"."}`;
    } else if(qs.missed.length){
      const added=qs.missed.filter(m=>!(qs.srsStart||{})[itemKey(m)]).length;
      note=added?`${added} added to your review list - they'll come back until you know them.`:`${qs.missed.length} missed question${qs.missed.length>1?"s were":" was"} already on your review list and went back to the start.`;

    }

}
function retryQuiz(){const q=quizState;startQuiz({topics:q.topics,excl:q.excl,dir:q.direction,count:q.count,pool:buildQuizPool(q.topics,q.excl),label:q.topicLabel});}
function retryMissed(){const q=quizState;startQuiz({topics:q.topics,dir:q.direction,count:"all",pool:q.pool,only:q.missed.slice(),label:"Missed: "+q.topicLabel});}

// ═══════════════════════════════════════════════════════════════
// Spaced-repetition review
//  Every missed question (Quiz, Conjugation Drill) joins the review
//  list. Each correct answer pushes it further out; a miss resets it.
// ═══════════════════════════════════════════════════════════════
const SRS_DAYS=[0,0,1,3,7,16,35];      // box -> days until next review
const SRS_MASTERED=5;                   // box 5 = the 16-day step = "mastered"
const SRS_SESSION=30;
const DAY_MS=86400000;
function srsLoad(){try{const o=JSON.parse(localStorage.getItem(K.srs)||"{}");return o&&typeof o==="object"&&!Array.isArray(o)?o:{};}catch(e){return {};}}
function srsSave(o){try{localStorage.setItem(K.srs,JSON.stringify(o));}catch(e){}}
function srsEntries(o){o=o||srsLoad();return Object.keys(o).filter(k=>k!=="_clearedAt").map(k=>Object.assign({key:k},o[k]));}
function srsRecord(key,correct){
  if(!key)return;
  const o=srsLoad(),now=Date.now();
  let e=o[key];
  if(!correct){
    o[key]={b:1,d:now,l:now,m:((e&&e.m)||0)+1};
  } else if(e){
    const b=Math.min((e.b||1)+1,SRS_DAYS.length-1);
    o[key]={b:b,d:now+SRS_DAYS[b]*DAY_MS,l:now,m:e.m||0};
  } else return;
  srsSave(o);
}
function srsStats(){
  const now=Date.now(),es=srsEntries();
  const due=es.filter(e=>e.d<=now);
  const upcoming=es.filter(e=>e.d>now).sort((a,b)=>a.d-b.d);
  return {total:es.length,due:due.length,mastered:es.filter(e=>e.b>=SRS_MASTERED).length,learning:es.filter(e=>e.b<SRS_MASTERED).length,next:upcoming.length?upcoming[0].d:null};
}
function srsIndex(){
  const map={};
  quizTopicIds().forEach(id=>{topicItems(id).forEach(it=>{const k=itemKey(it);if(!map[k])map[k]=it;});});
  return map;
}
function srsItemFor(key,idx){return idx[key]||(key.indexOf("dr|")===0?drillQuizItem(key):null);}
function srsDueItems(limit){
  const now=Date.now(),idx=srsIndex();
  return srsEntries().filter(e=>e.d<=now).sort((a,b)=>a.d-b.d||a.b-b.b).map(e=>srsItemFor(e.key,idx)).filter(Boolean).slice(0,limit||9999);
}
function fmtWhen(t){
  const days=Math.round((new Date(t).setHours(0,0,0,0)-new Date().setHours(0,0,0,0))/DAY_MS);
  if(days<=0)return "later today";if(days===1)return "tomorrow";
  return new Date(t).toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"});
}
function srsCardHtml(compact){

function drillKey(q){return q.kind==="v"?"dr|v|"+q.w.k+"|"+q.f:"dr|a|"+q.w.k+"|"+q.f;}
function drillQuizItem(key){
  const p=key.split("|");if(p.length<4)return null;
  const kind=p[1],word=p[2],form=p[3];
  if(kind==="v"){
    const v=VERBS.find(x=>x.k===word);const f=VERB_FORMS.find(x=>x.id===form);if(!v||!f)return null;
    const r=conjVerb(v,form);if(!r)return null;
    const others=shuffleArr(VERB_FORMS.map(x=>conjVerb(v,x.id)).filter(x=>x&&x.kanji!==r.kanji).map(x=>x.kanji));
    const wrong=[...new Set(others)].slice(0,3);if(wrong.length<3)return null;
    return {fixed:true,key:key,label:"Conjugation review",prompt:`${escHtml(v.k)} <span class="qz-sub">(${escHtml(v.en)})</span><div class="qz-hint">→ ${escHtml(f.label)} (${escHtml(f.sub)})</div>`,correct:r.kanji,wrong:wrong,expl:escHtml(verbRule(v,form)),speak:r.kana};
  }
  const a=ADJS.find(x=>x.k===word);const f=ADJ_FORMS.find(x=>x.id===form);if(!a||!f)return null;
  const val=conjAdjWord(a.k,a,form).plain;
  const others=shuffleArr(ADJ_FORMS.map(x=>conjAdjWord(a.k,a,x.id).plain).filter(x=>x!==val));
  const wrong=[...new Set(others)].slice(0,3);if(wrong.length<3)return null;
  return {fixed:true,key:key,label:"Conjugation review",prompt:`${escHtml(a.k)} <span class="qz-sub">(${escHtml(a.en)})</span><div class="qz-hint">→ ${escHtml(f.label)}</div>`,correct:val,wrong:wrong,expl:escHtml(adjRule(a,form)),speak:conjAdjWord(a.r,a,form).plain.replace(" 〜","")};
}

function recDB(){
  return new Promise((res,rej)=>{
    if(!window.indexedDB){rej(new Error("no_idb"));return;}
    const r=indexedDB.open(JAG_IDB,1);
    r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("takes")){const s=db.createObjectStore("takes",{keyPath:"id"});s.createIndex("jp","jp");}};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
}

  const db=await recDB();
  return new Promise((res,rej)=>{const tx=db.transaction("takes",mode);const st=tx.objectStore("takes");let out;Promise.resolve(fn(st)).then(v=>{out=v;});tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);});

function recNorm(s){return String(s).replace(/[\s、。！？!?「」・,.]/g,"").replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));}
function recCheck(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR||!rec.sel)return;
  const out=document.getElementById("recHeard");
  const r=new SR();r.lang="ja-JP";r.interimResults=false;r.maxAlternatives=3;
  out.textContent="Listening… say the sentence now.";
  r.onresult=e=>{
    const alts=[...e.results[0]].map(a=>a.transcript);
    const target=recNorm(rec.sel.jp);
    const exact=alts.some(a=>recNorm(a)===target);
    out.innerHTML=exact?`<b class="rec-ok">&#10003; Heard exactly: ${escHtml(alts[0])}</b>`:`Heard: <b>${escHtml(alts[0])}</b><br><span class="sync-small">If that means the same thing (it may use kanji where the guide uses kana), you were understood. If not, listen to the model again and retry.</span>`;
  };
  r.onerror=e=>{out.textContent=e.error==="not-allowed"?"Microphone blocked for speech recognition.":e.error==="no-speech"?"Didn't hear anything - try again a bit louder.":"Speech recognition isn't available right now.";};
  try{r.start();}catch(e){out.textContent="Speech recognition couldn't start.";}
}

// ═══════════════════════════════════════════════════════════════
// Cross-device progress sync
//  - GitHub Gist backend (private gist, token with "gist" scope)
//  - Manual backup code (copy / paste) as a no-setup fallback
//  Lists (stars, saved phrases) merge item by item: every item has its
//  own timestamp, and deletions are kept as tombstones so they spread.
//  The review list merges question by question; settings: newest wins.
// ═══════════════════════════════════════════════════════════════
const SYNC_KEYS=[K.stars,K.saved,K.quiz,K.hideRomaji,K.srs];
const SYNC_ITEM_ID={};
SYNC_ITEM_ID[K.stars]=x=>x&&x.unitId&&x.jp?x.unitId+"::"+x.jp:null;
SYNC_ITEM_ID[K.saved]=x=>x&&x.jp?x.jp:null;
const SYNC_TOMB_MS=180*DAY_MS;
let syncState={status:"off",last:null,timer:null,busy:false,pendingPush:false,msg:""};
function _lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function _lsSetRaw(k,v){try{(Storage.prototype.__jagOrigSet||Storage.prototype.setItem).call(localStorage,k,v);}catch(e){}}
function _json(s,def){try{const v=JSON.parse(s);return v==null?def:v;}catch(e){return def;}}
function _arr(s){const a=_json(s,[]);return Array.isArray(a)?a:[];}
function syncMeta(){const m=_json(_lsGet(K.syncMeta)||"{}",{});return m&&typeof m==="object"?m:{};}
function syncItemMeta(){const m=_json(_lsGet(K.syncItems)||"{}",{});return m&&typeof m==="object"?m:{};}
function syncCfg(){const c=_json(_lsGet(K.syncCfg)||"null",null);return c&&c.token?c:null;}
function saveSyncCfg(c){if(c)_lsSetRaw(K.syncCfg,JSON.stringify(c));else{try{localStorage.removeItem(K.syncCfg);}catch(e){}}}

// Stamp tracked keys (and individual list items) whenever they really change.
function _stampItems(k,oldStr,newStr,now){
  const idf=SYNC_ITEM_ID[k];if(!idf)return;
  const om={},nm={};
  _arr(oldStr).forEach(x=>{const id=idf(x);if(id)om[id]=JSON.stringify(x);});
  _arr(newStr).forEach(x=>{const id=idf(x);if(id)nm[id]=JSON.stringify(x);});
  const meta=syncItemMeta(),mk=meta[k]=meta[k]||{};
  Object.keys(nm).forEach(id=>{if(om[id]!==nm[id])mk[id]={t:now,d:0};});
  Object.keys(om).forEach(id=>{if(!(id in nm))mk[id]={t:now,d:1};});
  _lsSetRaw(K.syncItems,JSON.stringify(meta));
}
(function installSyncHook(){
  try{
    if(Storage.prototype.__jagOrigSet)return;
    const orig=Storage.prototype.setItem;
    Storage.prototype.__jagOrigSet=orig;
    Storage.prototype.setItem=function(k,v){
      let old=null,changed=false;
      if(this===window.localStorage&&SYNC_KEYS.indexOf(k)>=0){old=Storage.prototype.getItem.call(this,k);changed=old!==String(v);}
      orig.call(this,k,v);
      if(changed){
        const now=Date.now();
        const m=syncMeta();m[k]=now;
        orig.call(this,K.syncMeta,JSON.stringify(m));
        _stampItems(k,old,String(v),now);
        scheduleSyncPush();
      }
    };
  }catch(e){}
})();

function _localList(k){
  const idf=SYNC_ITEM_ID[k],mk=syncItemMeta()[k]||{},list={},now=Date.now();
  _arr(_lsGet(k)).forEach(x=>{const id=idf(x);if(id)list[id]={v:x,t:(mk[id]&&!mk[id].d)?mk[id].t:0,d:0};});
  Object.keys(mk).forEach(id=>{const e=mk[id];if(e.d&&!list[id]&&now-e.t<SYNC_TOMB_MS)list[id]={v:null,t:e.t,d:1};});
  return list;
}
function localSnapshot(){
  const m=syncMeta(),items={};
  SYNC_KEYS.forEach(k=>{
    if(SYNC_ITEM_ID[k]){items[k]={list:_localList(k),t:m[k]||0};return;}
    const v=_lsGet(k);if(v!==null)items[k]={v:v,t:m[k]||0};
  });
  return {app:JAG_APP,version:2,updated:Date.now(),items:items};
}
// Review history merges per question: the most recent answer for each one wins.
function _mergeSRS(a,b){
  let A=_json(a||"{}",{}),B=_json(b||"{}",{});
  const cleared=Math.max(A._clearedAt||0,B._clearedAt||0),out={};
  if(cleared)out._clearedAt=cleared;
  new Set(Object.keys(A).concat(Object.keys(B))).forEach(k=>{
    if(k==="_clearedAt")return;
    const x=A[k],y=B[k];
    const w=!x?y:!y?x:((y.l||0)>(x.l||0)?y:x);
    if(w&&(w.l||0)>=cleared)out[k]=w;
  });
  return JSON.stringify(out);
}
function _mergeList(k,remoteEntry,res){
  const local=_localList(k);
  let remote=remoteEntry&&remoteEntry.list;
  if(!remote&&remoteEntry&&remoteEntry.v){ // tolerate a plain array
    remote={};const idf=SYNC_ITEM_ID[k];_arr(remoteEntry.v).forEach(x=>{const id=idf(x);if(id)remote[id]={v:x,t:remoteEntry.t||0,d:0};});
  }
  remote=remote||{};
  const ids=new Set(Object.keys(local).concat(Object.keys(remote)));
  const win={};
  ids.forEach(id=>{
    const L=local[id],R=remote[id];
    win[id]=!L?R:!R?L:(R.t>L.t?R:L);
    const W=win[id];
    if(!R||R.t!==W.t||!!R.d!==!!W.d||JSON.stringify(R.v)!==JSON.stringify(W.v))res.needPush=true;
  });
  // keep local order, then add new items from the other device
  const idf=SYNC_ITEM_ID[k],out=[],used=new Set();
  _arr(_lsGet(k)).forEach(x=>{const id=idf(x);if(id&&win[id]&&!win[id].d&&!used.has(id)){used.add(id);out.push(win[id].v);}});
  Object.keys(remote).forEach(id=>{if(win[id]&&!win[id].d&&!used.has(id)){used.add(id);out.push(win[id].v);}});
  if(k===K.saved)out.sort((a,b)=>((b&&b.created)||0)-((a&&a.created)||0));
  const str=JSON.stringify(out);
  if(str!==(_lsGet(k)||"[]")){_lsSetRaw(k,str);res.changedLocal=true;}
  const meta=syncItemMeta(),mk={},now=Date.now();
  ids.forEach(id=>{const W=win[id];if(W&&W.t&&!(W.d&&now-W.t>=SYNC_TOMB_MS))mk[id]={t:W.t,d:W.d?1:0};});
  meta[k]=mk;_lsSetRaw(K.syncItems,JSON.stringify(meta));
}
// Merge a remote snapshot into localStorage. Returns {changedLocal, needPush}.
function mergeSnapshot(remote){
  const res={changedLocal:false,needPush:false};
  if(!remote||!remote.items)return {changedLocal:false,needPush:true};
  const m=syncMeta();
  SYNC_KEYS.forEach(k=>{
    const r=remote.items[k];
    if(SYNC_ITEM_ID[k]){_mergeList(k,r,res);if(r)m[k]=Math.max(m[k]||0,r.t||0);return;}
    const lv=_lsGet(k),lt=m[k]||0;
    if(!r){if(lv!==null)res.needPush=true;return;}
    let winV,winT;
    if(k===K.srs&&lv!==null){winV=_mergeSRS(lv,r.v);winT=Math.max(lt,r.t);}
    else if(lv===null){winV=r.v;winT=r.t;}
    else if(r.t>lt){winV=r.v;winT=r.t;}
    else{winV=lv;winT=lt;}
    if(winV!==lv){_lsSetRaw(k,winV);res.changedLocal=true;}
    if(winV!==r.v||winT!==r.t)res.needPush=true;
    m[k]=winT;
  });
  _lsSetRaw(K.syncMeta,JSON.stringify(m));
  return res;
}

// ── GitHub Gist backend ──
async function gh(path,opts){
  const c=syncCfg();
  const o=Object.assign({cache:"no-store"},opts||{});
  o.headers=Object.assign({"Accept":"application/vnd.github+json","Authorization":"Bearer "+c.token},(opts&&opts.headers)||{});
  const r=await fetch("https://api.github.com"+path,o);
  if(r.status===401){const e=new Error("bad_token");e.code=401;throw e;}
  if(r.status===404){const e=new Error("not_found");e.code=404;throw e;}
  if(!r.ok){const e=new Error("http_"+r.status);e.code=r.status;throw e;}
  return r.status===204?null:r.json();
}
async function findOrCreateGist(){
  const c=syncCfg();
  if(c.gistId){
    try{await gh("/gists/"+c.gistId);return c.gistId;}catch(e){if(e.code!==404)throw e;}
  }
  for(let page=1;page<=5;page++){
    const list=await gh("/gists?per_page=100&page="+page);
    const hit=list.find(g=>g.files&&g.files[JAG_GIST_FILE]);
    if(hit){c.gistId=hit.id;saveSyncCfg(c);return hit.id;}
    if(list.length<100)break;
  }
  const files={};files[JAG_GIST_FILE]={content:JSON.stringify(localSnapshot())};
  const g=await gh("/gists",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({description:"Japanese Audio Guide progress (synced by the guide)",public:false,files:files})});
  c.gistId=g.id;saveSyncCfg(c);
  return g.id;
}
async function pullRemote(){
  const c=syncCfg();
  const g=await gh("/gists/"+c.gistId);
  const f=g.files&&g.files[JAG_GIST_FILE];
  if(!f)return null;
  let txt=f.content;
  if(f.truncated&&f.raw_url){txt=await (await fetch(f.raw_url,{cache:"no-store"})).text();}
  return _json(txt,null);
}
async function pushRemote(keepalive){
  const c=syncCfg();
  const files={};files[JAG_GIST_FILE]={content:JSON.stringify(localSnapshot())};
  await gh("/gists/"+c.gistId,{method:"PATCH",keepalive:!!keepalive,headers:{"Content-Type":"application/json"},body:JSON.stringify({files:files})});
}
function setSyncStatus(s,msg){syncState.status=s;syncState.msg=msg||"";renderSyncPill();}
function syncErrText(e){
  if(e&&e.code===401)return "GitHub rejected the key. Make a new one and connect again.";
  if(e&&e.code===403)return "GitHub refused (the key needs the 'gist' permission, or you hit a rate limit).";
  if(!navigator.onLine)return "You're offline - changes are kept on this device and will sync later.";
  return "Couldn't reach GitHub - will retry.";
}
async function syncNow(opts){
  opts=opts||{};
  if(!syncCfg()){setSyncStatus("off");return;}
  if(syncState.busy){syncState.pendingPush=true;return;}
  clearTimeout(syncState.timer);
  syncState.busy=true;setSyncStatus("syncing");
  try{
    if(!syncCfg().gistId)await findOrCreateGist();
    let remote;
    try{remote=await pullRemote();}catch(e){if(e.code===404){saveSyncCfg(Object.assign(syncCfg(),{gistId:null}));await findOrCreateGist();remote=await pullRemote();}else throw e;}
    const r=mergeSnapshot(remote&&remote.app===JAG_APP?remote:null);
    if(r.needPush||opts.forcePush)await pushRemote();
    syncState.last=Date.now();setSyncStatus("ok");
    if(r.changedLocal)onRemoteChanges(opts.initial);
  }catch(e){
    setSyncStatus(e&&e.code===401?"error":"retry",syncErrText(e));
    if(!(e&&(e.code===401||e.code===403)))setTimeout(()=>syncNow(),30000);
  }finally{
    syncState.busy=false;
    if(syncState.pendingPush){syncState.pendingPush=false;scheduleSyncPush(300);}
  }
}
function scheduleSyncPush(delay){
  if(!syncCfg())return;
  clearTimeout(syncState.timer);
  setSyncStatus("pending");
  syncState.timer=setTimeout(()=>syncNow(),delay==null?2000:delay);
}
function syncBusyStudying(){
  return (quizState&&!quizState._done&&quizState.index>0)||(typeof drillState!=="undefined"&&drillState&&drillState.i>0&&drillState.i<drillState.qs.length)||rec.recording;
}
function onRemoteChanges(initial){
  let recent=false;
  try{recent=Date.now()-Number(sessionStorage.getItem(K.syncReloaded)||0)<15000;}catch(e){}
  if(initial&&!recent&&!syncBusyStudying()){
    try{sessionStorage.setItem(K.syncReloaded,String(Date.now()));}catch(e){}
    location.reload();
  } else showSyncBanner();
}
function showSyncBanner(){
  if(document.getElementById("syncBanner"))return;
  const d=document.createElement("div");
  d.id="syncBanner";d.className="sync-banner";
  d.innerHTML=`<span>New progress from another device.</span><button onclick="location.reload()">Refresh</button>`;
  document.body.appendChild(d);
}
function renderSyncPill(){
  const b=document.getElementById("syncPill");
  if(!b)return;
  const s=syncState.status;
  const t=syncState.last?new Date(syncState.last).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):"";
  const label={off:"Sync: off",syncing:"Syncing…",pending:"Saving…",ok:"Synced"+(t?" "+t:""),retry:"Sync: waiting",error:"Sync: fix key"}[s]||"Sync";
  b.textContent="☁ "+label;
  b.className="sync-pill "+s;
  const st=document.getElementById("syncPanelStatus");
  if(st)st.textContent=syncState.msg||(s==="ok"?"Everything is saved to your GitHub.":s==="off"?"Sync is off on this device.":"");
}
function openSyncPanel(){
  closeSyncPanel();
  const c=syncCfg();
  const d=document.createElement("div");
  d.id="syncPanel";d.className="sync-overlay";
  d.onclick=e=>{if(e.target===d)closeSyncPanel();};
  d.innerHTML=`<div class="sync-card" role="dialog" aria-label="Sync progress">
    <div class="sync-head"><b>Sync your progress</b><button class="sync-x" onclick="closeSyncPanel()" aria-label="Close">&times;</button></div>
    <div class="sync-sub">Stars, saved phrases, quiz settings, your review list and the hide-romaji setting - on every computer and your phone. This guide keeps its own sync file, separate from your N5 guide.</div>
    ${c?`<div class="sync-box ok">
      <div><b>Connected to GitHub</b> on this device.</div>
      <div class="sync-status" id="syncPanelStatus"></div>
      <div class="sync-row"><button class="sync-btn" onclick="syncNow({forcePush:true})">Sync now</button><button class="sync-btn ghost" onclick="disconnectSync()">Disconnect this device</button></div>
      <div class="sync-small">Other devices: open this guide there, tap ☁ Sync and paste the same key.</div>
    </div>`:`<div class="sync-box">
      <div class="sync-step"><span>1</span><div>Create a GitHub key that can only touch Gists: <a class="ext-link" href="https://github.com/settings/tokens/new?scopes=gist&description=Japanese%20Audio%20Guide%20sync" target="_blank" rel="noopener">Open GitHub</a><div class="sync-small">Leave "gist" ticked (nothing else), pick an expiration, press <i>Generate token</i> and copy it. You can reuse the key from your N5 guide - each guide keeps its own file.</div></div></div>
      <div class="sync-step"><span>2</span><div>Paste the key here:<input id="syncTokenInput" class="sync-input" type="password" placeholder="ghp_..." autocomplete="off" spellcheck="false"></div></div>
      <div class="sync-row"><button class="sync-btn" onclick="connectSync()">Connect</button></div>
      <div class="sync-status" id="syncPanelStatus"></div>
      <div class="sync-small">Your progress goes into one <b>private</b> Gist on your GitHub account. The key is stored only in this browser.</div>
    </div>`}
    <details class="sync-details"><summary>No GitHub? Use a backup code</summary>
      <div class="sync-small">Copy the code on one device and paste it on another. It's a one-time copy, not live sync.</div>
      <div class="sync-row"><button class="sync-btn ghost" onclick="copyBackupCode(this)">Copy my progress code</button></div>
      <textarea id="syncCodeInput" class="sync-input" rows="3" placeholder="Paste a progress code here"></textarea>
      <div class="sync-row"><button class="sync-btn ghost" onclick="importBackupCode()">Load code</button></div>
    </details>
  </div>`;
  document.body.appendChild(d);
  renderSyncPill();
}
function closeSyncPanel(){const d=document.getElementById("syncPanel");if(d)d.remove();}
async function connectSync(){
  const inp=document.getElementById("syncTokenInput");
  const token=(inp&&inp.value||"").trim();
  const st=document.getElementById("syncPanelStatus");
  if(!/^(ghp_|github_pat_|gho_)[A-Za-z0-9_]{20,}$/.test(token)){if(st)st.textContent="That doesn't look like a GitHub key (it starts with ghp_ or github_pat_).";return;}
  saveSyncCfg({token:token,gistId:null});
  if(st)st.textContent="Connecting…";
  await syncNow({initial:true});
  if(syncState.status==="ok"){openSyncPanel();}
  else{const msg=syncState.msg;if(syncState.status==="error")saveSyncCfg(null);openSyncPanel();const s2=document.getElementById("syncPanelStatus");if(s2)s2.textContent=msg;}
}
function disconnectSync(){
  if(!confirm("Stop syncing on this device? Your progress stays here and on GitHub."))return;
  saveSyncCfg(null);setSyncStatus("off");openSyncPanel();
}
function backupCode(){return JAG_CODE_PREFIX+btoa(unescape(encodeURIComponent(JSON.stringify(localSnapshot()))));}
function copyBackupCode(btn){
  const code=backupCode();
  const show=()=>{const t=document.getElementById("syncCodeInput");t.value=code;t.select();btn.textContent="Code shown below - copy it";};
  const done=()=>{btn.textContent="Copied!";setTimeout(()=>btn.textContent="Copy my progress code",1500);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(done,show);else show();
}
function importBackupCode(){
  const raw=(document.getElementById("syncCodeInput").value||"").trim();
  try{
    if(raw.indexOf(JAG_CODE_PREFIX)!==0)throw 0;
    const snap=JSON.parse(decodeURIComponent(escape(atob(raw.slice(JAG_CODE_PREFIX.length)))));
    if(!snap||snap.app!==JAG_APP)throw 0;
    const r=mergeSnapshot(snap);
    if(syncCfg())scheduleSyncPush(200);
    alert(r.changedLocal?"Progress loaded. The page will refresh.":"Nothing new in that code - you're already up to date.");
    if(r.changedLocal)location.reload();
  }catch(e){alert("That code didn't work. Copy the whole code, starting with "+JAG_CODE_PREFIX+" (codes from the N5 guide won't work here).");}
}
function initSync(){
  renderSyncPill();
  document.addEventListener("visibilitychange",()=>{
    if(!syncCfg())return;
    if(document.visibilityState==="visible"){if(!syncState.busy)syncNow();}
    else if(syncState.status==="pending"){clearTimeout(syncState.timer);pushRemote(true).catch(()=>{});}
  });
  window.addEventListener("online",()=>{if(syncCfg())syncNow();});
  if(!syncCfg()){setSyncStatus("off");return;}
  syncNow({initial:true});
}

// Wiring: one switchTab wrapper for everything the ports need

(function(){
  const _sw=switchTab;
  switchTab=function(id){
    if(id!=="recorder"&&rec.recording)recStop();          // stop the mic if you leave mid-recording
    _sw(id);
    if(!units.some(u=>u.id===id))id=NAV_HOME;
    navCurrent=id;
    if(id!==NAV_HOME){try{localStorage.setItem(K.lastStudy,id);}catch(e){}}
    if(id===NAV_HOME)renderHome();
    if(id==="quiz"&&document.getElementById("qzTopics"))renderQuizTab();  // fresh counts on the setup screen
    if(id==="recorder"&&!document.getElementById("recList"))renderRecorder();
    navRefresh();
    navScrollToTop();
  };
})();

})();
// Conjugation Drill answers feed the review list too
(function(){
  const _chk=checkDrill;
  checkDrill=function(reveal){
    const s=drillState;
    if(!s||s.answered)return _chk(reveal);
    const q=s.qs[s.i],before=s.score;
    _chk(reveal);
    if(s.answered)srsRecord(drillKey(q),s.score>before);
  };
})();
