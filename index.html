{id:"basics",tab:"Sentence Basics",title:"Sentence Basics",sub:"Start here. The core building blocks every Japanese sentence is made from. Red = particles, purple = grammar endings.",sections:[
  {header:true,title:"How a Japanese sentence works"},
  {title:"1. Word order: the verb goes last",color:"blue",layout:"lesson",
    intro:"English is Subject - Verb - Object (I <b>eat</b> sushi). Japanese is Subject - Object - Verb (I sushi <b>eat</b>). The verb (or です) always comes at the very end. Small words called <b>particles</b> come right after each word and mark the role it plays, so the middle of the sentence is flexible, but the verb stays last.",
    formula:"Topic + は + Object + を + Verb",
    phrases:[
      {jp:"わたし[は] すし[を] たべます。",rom:"Watashi wa sushi wo tabemasu.",en:"I eat sushi."},
      {jp:"わたし[は] まいにち コーヒー[を] のみます。",rom:"Watashi wa mainichi koohii wo nomimasu.",en:"I drink coffee every day."},
      {jp:"ともだち[は] きょう とうきょう[に] いきます。",rom:"Tomodachi wa kyou Toukyou ni ikimasu.",en:"My friend is going to Tokyo today."}
    ],
    tip:"Japanese drops anything obvious from context. If it's clear you mean yourself, skip わたしは entirely: すしを たべます。 is completely natural, and saying わたしは in every sentence sounds stiff."},
  {title:"2. The basic sentence: A は B です",color:"blue",layout:"lesson",
    intro:"The simplest sentence is 'A is B'. は (written <i>ha</i>, pronounced <i>wa</i>) marks the topic, and です at the end makes it polite. です works like am / is / are for nouns and な-adjectives.",
    formula:"A + は + B + です",
    phrases:[
      {jp:"わたし[は] がくせい{です}。",rom:"Watashi wa gakusei desu.",en:"I am a student."},
      {jp:"これ[は] ほん{です}。",rom:"Kore wa hon desu.",en:"This is a book."},
      {jp:"たなかさん[は] せんせい{です}。",rom:"Tanaka-san wa sensei desu.",en:"Mr./Ms. Tanaka is a teacher.",note:"さん is a polite title. Never use it about yourself."},
      {jp:"あした[は] にちようび{です}。",rom:"Ashita wa nichiyoubi desu.",en:"Tomorrow is Sunday."}
    ]},
  {title:"3. です in every tense (noun sentences)",color:"purple",layout:"lesson",
    intro:"Nouns don't conjugate. The ending after them (です / だ) changes instead. Polite is for strangers, staff and anyone older; plain (casual) is for friends and family, and is also used inside longer grammar patterns.",
    table:{cols:["","Polite","Plain (casual)","English"],speak:1,en:3,rows:[
      ["Present","がくせい{です}|gakusei desu","がくせい{だ}|gakusei da","is a student"],
      ["Negative","がくせい{じゃありません}|gakusei ja arimasen","がくせい{じゃない}|gakusei ja nai","is not a student"],
      ["Past","がくせい{でした}|gakusei deshita","がくせい{だった}|gakusei datta","was a student"],
      ["Past negative","がくせい{じゃありませんでした}|gakusei ja arimasen deshita","がくせい{じゃなかった}|gakusei ja nakatta","was not a student"]
    ]},
    tip:"じゃありません can also be ではありません (more formal) or じゃないです (softer, very common in speech). All three are correct."},
  {header:true,title:"Questions"},
  {title:"4. Asking questions with か",color:"blue",layout:"lesson",
    intro:"To turn any polite statement into a question, add か at the end. The word order doesn't change. Your voice goes up at the end, and in writing you can add ？.",
    formula:"Statement + か",
    phrases:[
      {jp:"がくせい ですか。",rom:"Gakusei desu ka?",en:"Are you a student?"},
      {jp:"すし[を] たべます{か}。",rom:"Sushi wo tabemasu ka?",en:"Do you eat sushi?"},
      {jp:"はい、そうです。",rom:"Hai, sou desu.",en:"Yes, that's right."},
      {jp:"いいえ、ちがいます。",rom:"Iie, chigaimasu.",en:"No, that's not right."}
    ]},
  {title:"5. Question words",color:"blue",layout:"lesson",
    intro:"A question word sits in the same place the answer will go. Ask トイレは どこですか, and the answer is トイレは あそこです.",
    table:{cols:["Word","Meaning","Example","English"],speak:2,en:3,rows:[
      ["なに / なん|nani / nan","what","これ[は] なん ですか。|Kore wa nan desu ka?","What is this?"],
      ["だれ|dare","who","あの ひと[は] だれ ですか。|Ano hito wa dare desu ka?","Who is that person?"],
      ["どこ|doko","where","トイレ[は] どこ ですか。|Toire wa doko desu ka?","Where is the bathroom?"],
      ["いつ|itsu","when","たんじょうび[は] いつ ですか。|Tanjoubi wa itsu desu ka?","When is your birthday?"],
      ["なんじ|nanji","what time","いま なんじ ですか。|Ima nanji desu ka?","What time is it now?"],
      ["いくら|ikura","how much","これ[は] いくら ですか。|Kore wa ikura desu ka?","How much is this?"],
      ["どう|dou","how","にほん[は] どう でしたか。|Nihon wa dou deshita ka?","How was Japan?"],
      ["どれ|dore","which (of 3+)","どれ[が] いい ですか。|Dore ga ii desu ka?","Which one is good?"],
      ["どうして|doushite","why","どうして にほんご[を] べんきょうしますか。|Doushite nihongo wo benkyou shimasu ka?","Why do you study Japanese?"]
    ]},
    tip:"なに vs なん: use なん before です, の, で and counters (なんですか, なんじ, なんにん). Use なに before を and が (なにを たべますか)."},
  {header:true,title:"Topic, subject and connecting words"},
  {title:"6. は vs が: topic vs subject",color:"red",layout:"lesson",
    intro:"<b>は</b> marks the <b>topic</b>, roughly 'as for X'. It sets the stage, usually for something already known. <b>が</b> marks the <b>subject</b>. It points at exactly who or what, and is used for new information, for answers to question words, and with words like すき, ある / いる and わかる.",
    table:{cols:["Use","Particle","Example","English"],speak:2,en:3,rows:[
      ["Introducing the topic","[は]","わたし[は] ドノバン です。|Watashi wa Donoban desu.","As for me, I'm Donovan."],
      ["Question word as subject","[が]","だれ[が] きましたか。|Dare ga kimashita ka?","Who came?"],
      ["Answering that question","[が]","たなかさん[が] きました。|Tanaka-san ga kimashita.","Tanaka came."],
      ["Likes and dislikes","[が]","わたし[は] すし[が] すき です。|Watashi wa sushi ga suki desu.","I like sushi."],
      ["Existence (ある / いる)","[が]","へや[に] テレビ[が] あります。|Heya ni terebi ga arimasu.","There is a TV in the room."],
      ["Contrast","[は]","にく[は] たべますが、さかな[は] たべません。|Niku wa tabemasu ga, sakana wa tabemasen.","Meat I eat, but fish I don't."]
    ]},
    mistakes:[{wrong:"だれは きましたか。",right:"だれが きましたか。",why:"Question words (だれ, なに, どれ, どこ) can never be the topic. They always take が."}],
    tip:"Rule of thumb: は = 'about this topic...', が = 'THIS one (and not something else)'."},
  {title:"7. の: connecting nouns",color:"red",layout:"lesson",
    intro:"A の B means 'A's B' or 'B of / from A'. The main noun is always the LAST one: にほんの くるま is a car, not Japan.",
    formula:"Noun A + の + Noun B",
    phrases:[
      {jp:"わたし[の] なまえ",rom:"watashi no namae",en:"my name"},
      {jp:"ともだち[の] いえ",rom:"tomodachi no ie",en:"my friend's house"},
      {jp:"にほん[の] くるま",rom:"Nihon no kuruma",en:"a Japanese car (a car from Japan)"},
      {jp:"にほんご[の] せんせい",rom:"nihongo no sensei",en:"a Japanese (language) teacher"},
      {jp:"これ[は] だれ[の] かばん ですか。",rom:"Kore wa dare no kaban desu ka?",en:"Whose bag is this?"},
      {jp:"わたし[の] です。",rom:"Watashi no desu.",en:"It's mine.",note:"Drop the second noun when it's obvious: わたしの = mine."}
    ]},
  {title:"8. と, や, も: and, also",color:"red",layout:"lesson",
    table:{cols:["Particle","Meaning","Example","English"],speak:2,en:3,rows:[
      ["[と]","and (complete list)","すし[と] ラーメン[を] たべました。|Sushi to raamen wo tabemashita.","I ate sushi and ramen (that's all)."],
      ["[や]","and (partial list, 'things like')","すし[や] ラーメン[を] たべました。|Sushi ya raamen wo tabemashita.","I ate sushi, ramen and other things."],
      ["[も]","also / too","わたし[も] いきます。|Watashi mo ikimasu.","I'm going too."]
    ]},
    mistakes:[{wrong:"わたしはも いきます。",right:"わたしも いきます。",why:"も REPLACES は, が and を. With other particles it goes after them: にも, でも, とも."}],
    tip:"と and や only join nouns. To join two sentences ('I ate and then slept'), use the て-form (see Sentence Patterns)."},
  {title:"9. There is / to have: あります vs います",color:"red",layout:"lesson",
    intro:"Japanese has two verbs for 'there is' and 'to have'. <b>あります</b> is for objects and plants (non-living). <b>います</b> is for people and animals (living).",
    formula:"Place + に + Thing + が + あります / います",
    phrases:[
      {jp:"へや[に] テレビ[が] あります。",rom:"Heya ni terebi ga arimasu.",en:"There is a TV in the room."},
      {jp:"こうえん[に] いぬ[が] います。",rom:"Kouen ni inu ga imasu.",en:"There is a dog in the park."},
      {jp:"わたし[は] あに[が] います。",rom:"Watashi wa ani ga imasu.",en:"I have an older brother."},
      {jp:"じかん[が] ありません。",rom:"Jikan ga arimasen.",en:"I don't have time."},
      {jp:"トイレ[は] どこ[に] ありますか。",rom:"Toire wa doko ni arimasu ka?",en:"Where is the bathroom?",note:"When asking WHERE something is, the thing becomes the topic (は)."}
    ]},
  {header:true,title:"This, that, which"},
  {title:"KO-SO-A-DO: demonstratives at a glance",color:"blue",layout:"kosoado",kosoado:{
    columns:[
      {key:"ko",label:"KO",kana:"こ"},
      {key:"so",label:"SO",kana:"そ"},
      {key:"a",label:"A",kana:"あ"},
      {key:"do",label:"DO",kana:"ど"}
    ],
    rows:[
      {label:"Thing",sub:"物 (mono)",cells:{
        ko:{jp:"これ",rom:"kore",en:"this"},
        so:{jp:"それ",rom:"sore",en:"that"},
        a:{jp:"あれ",rom:"are",en:"that over there"},
        do:{jp:"どれ",rom:"dore",en:"which"}
      }},
      {label:"+ Noun",sub:"〜の (modifying)",cells:{
        ko:{jp:"この",rom:"kono",en:"this + noun"},
        so:{jp:"その",rom:"sono",en:"that + noun"},
        a:{jp:"あの",rom:"ano",en:"that + noun, over there"},
        do:{jp:"どの",rom:"dono",en:"which + noun"}
      }},
      {label:"Place",sub:"場所 (basho)",cells:{
        ko:{jp:"ここ",rom:"koko",en:"here"},
        so:{jp:"そこ",rom:"soko",en:"there"},
        a:{jp:"あそこ",rom:"asoko",en:"over there"},
        do:{jp:"どこ",rom:"doko",en:"where"}
      }},
      {label:"Direction / Polite",sub:"丁寧 (teinei)",cells:{
        ko:{jp:"こちら",rom:"kochira",en:"here / this way"},
        so:{jp:"そちら",rom:"sochira",en:"there / that way"},
        a:{jp:"あちら",rom:"achira",en:"over there / that way"},
        do:{jp:"どちら",rom:"dochira",en:"where / which way"}
      }}
    ]
  }},
  {title:"Demonstratives - kono sono ano",color:"blue",phrases:[
    {jp:"この〜",rom:"kono ~",en:"This ___ (near me)",note:"kono + noun = this thing close to the speaker"},
    {jp:"その〜",rom:"sono ~",en:"That ___ (near you)",note:"sono + noun = that thing close to the listener"},
    {jp:"あの〜",rom:"ano ~",en:"That ___ over there",note:"ano + noun = that thing far from both of us"},
    {jp:"どの〜",rom:"dono ~",en:"Which ___?",note:"dono + noun = which one?"},
    {jp:"このシャツは いくらですか？",rom:"Kono shatsu wa ikura desuka?",en:"How much is THIS shirt?",role:"you"},
    {jp:"そのかばんは だれのですか？",rom:"Sono kaban wa dare no desuka?",en:"Whose is THAT bag?",role:"you"},
    {jp:"あのレストランは おいしいですよ。",rom:"Ano resutoran wa oishii desu yo.",en:"THAT restaurant over there is delicious!",role:"staff"},
    {jp:"どのサイズが いいですか？",rom:"Dono saizu ga ii desuka?",en:"Which size is good?",role:"staff"}
  ]},
  {title:"Standalone demonstratives - kore sore are",color:"blue",phrases:[
    {jp:"これ",rom:"kore",en:"This one (near me) - stands alone, no noun needed"},
    {jp:"それ",rom:"sore",en:"That one (near you) - stands alone"},
    {jp:"あれ",rom:"are",en:"That one over there - stands alone"},
    {jp:"どれ",rom:"dore",en:"Which one? - stands alone"},
    {jp:"これを ください。",rom:"Kore wo kudasai.",en:"I will take this one.",note:"kore = this one - no noun needed",role:"you"},
    {jp:"それは なんですか？",rom:"Sore wa nan desuka?",en:"What is that (near you)?",role:"you"},
    {jp:"あれが すきです。",rom:"Are ga suki desu.",en:"I like that one over there.",role:"you"},
    {jp:"どれが いいですか？",rom:"Dore ga ii desuka?",en:"Which one is good?",role:"staff"}
  ]},
]},
{id:"particles",tab:"Particles",title:"Particles",sub:"Particles are the glue of Japanese. Each one sits right AFTER the word it marks and tells you that word's job.",sections:[
  {header:true,title:"Overview"},
  {title:"Particle cheat sheet",color:"red",layout:"lesson",
    table:{cols:["Particle","Main jobs","Example","English"],speak:2,en:3,rows:[
      ["は|wa","topic: 'as for...'","わたし[は] がくせい です。|Watashi wa gakusei desu.","I am a student."],
      ["が|ga","subject, new info, likes, existence","ねこ[が] います。|Neko ga imasu.","There is a cat."],
      ["を|o","direct object (what the action is done to)","パン[を] たべます。|Pan wo tabemasu.","I eat bread."],
      ["に|ni","specific time, destination, where something IS, target person","7じ[に] おきます。|Shichi-ji ni okimasu.","I get up at 7."],
      ["で|de","where an action HAPPENS, means / tool, language","えき[で] まちます。|Eki de machimasu.","I'll wait at the station."],
      ["へ|e","direction (toward)","にほん[へ] いきます。|Nihon e ikimasu.","I'm going to Japan."],
      ["と|to","and (full list), with (a person)","ともだち[と] いきます。|Tomodachi to ikimasu.","I'll go with a friend."],
      ["の|no","possession, connecting nouns","わたし[の] ほん|watashi no hon","my book"],
      ["も|mo","also, too","わたし[も] いきます。|Watashi mo ikimasu.","I'm going too."],
      ["から|kara","from (time / place), because","9じ[から] はたらきます。|Ku-ji kara hatarakimasu.","I work from 9."],
      ["まで|made","until, as far as","5じ[まで] はたらきます。|Go-ji made hatarakimasu.","I work until 5."],
      ["か|ka","question marker, or","コーヒー[か] こうちゃ|koohii ka koucha","coffee or tea"],
      ["ね|ne","'right?', seeking agreement","いい てんき です[ね]。|Ii tenki desu ne.","Nice weather, isn't it?"],
      ["よ|yo","telling new info, emphasis","おいしい です[よ]。|Oishii desu yo.","It's delicious, you know!"]
    ]},
    tip:"Three spelling surprises: は is pronounced wa, へ is pronounced e, and を is pronounced o, but only when they are particles."},
  {header:true,title:"The core particles in depth"},
  {title:"を: the direct object",color:"red",layout:"lesson",
    intro:"を marks the thing that directly receives the action: what you eat, drink, buy, read, watch. It also marks a space you move THROUGH (walk along a road, cross a bridge).",
    formula:"Object + を + Verb",
    phrases:[
      {jp:"ほん[を] よみます。",rom:"Hon wo yomimasu.",en:"I read a book."},
      {jp:"みず[を] ください。",rom:"Mizu wo kudasai.",en:"Water, please."},
      {jp:"にほんご[を] べんきょうします。",rom:"Nihongo wo benkyou shimasu.",en:"I study Japanese."},
      {jp:"みち[を] あるきます。",rom:"Michi wo arukimasu.",en:"I walk along the road.",note:"を with movement verbs = the path you move through."},
      {jp:"はし[を] わたって ください。",rom:"Hashi wo watatte kudasai.",en:"Please cross the bridge."}
    ]},
  {title:"に: the 'point' particle",color:"red",layout:"lesson",
    intro:"Think of に as pointing at a precise spot: a point in time, a destination, the place where something exists, or the person on the receiving end.",
    table:{cols:["Use","Example","English"],speak:1,en:2,rows:[
      ["Specific time","7じ[に] おきます。|Shichi-ji ni okimasu.","I get up at 7."],
      ["Destination","がっこう[に] いきます。|Gakkou ni ikimasu.","I go to school."],
      ["Where something exists","いえ[に] ねこ[が] います。|Ie ni neko ga imasu.","There's a cat at home."],
      ["Person you meet / call / give to","ともだち[に] あいます。|Tomodachi ni aimasu.","I meet my friend."],
      ["Purpose of going (stem + に)","すし[を] たべ[に] いきます。|Sushi wo tabe ni ikimasu.","I'm going to go eat sushi."]
    ]},
    mistakes:[
      {wrong:"あしたに いきます。",right:"あした いきます。",why:"Relative time words (today, tomorrow, every day, next week) take NO particle. Only specific times (7じ, 3がつ, にちようび) take に."},
      {wrong:"ともだちを あいます。",right:"ともだちに あいます。",why:"あう (meet) takes に for the person, not を."}
    ]},
  {title:"で: where the action happens, and 'by means of'",color:"red",layout:"lesson",
    intro:"で marks the stage where an action takes place, and also the tool, transport or language you use to do it.",
    table:{cols:["Use","Example","English"],speak:1,en:2,rows:[
      ["Place of action","レストラン[で] たべます。|Resutoran de tabemasu.","I eat at a restaurant."],
      ["Transport","でんしゃ[で] いきます。|Densha de ikimasu.","I go by train."],
      ["Tool","はし[で] たべます。|Hashi de tabemasu.","I eat with chopsticks."],
      ["Language","にほんご[で] はなします。|Nihongo de hanashimasu.","I speak in Japanese."],
      ["Total / scope","ぜんぶ[で] 1000えん です。|Zenbu de sen-en desu.","It's 1,000 yen in total."]
    ]}},
  {title:"に vs で: the #1 particle mix-up",color:"red",layout:"lesson",
    intro:"Both can translate as 'at' or 'in'. Ask yourself: is something <b>happening</b> there (で), or is it just <b>being</b> or <b>arriving</b> there (に)?",
    table:{cols:["Situation","Particle","Example","English"],speak:2,en:3,rows:[
      ["Being / existing (いる, ある, すむ)","[に]","こうえん[に] います。|Kouen ni imasu.","I'm at the park."],
      ["Doing an activity","[で]","こうえん[で] あそびます。|Kouen de asobimasu.","I play at the park."],
      ["Going / arriving","[に]","こうえん[に] いきます。|Kouen ni ikimasu.","I go to the park."]
    ]},
    mistakes:[{wrong:"レストランに たべます。",right:"レストランで たべます。",why:"Eating is an action happening at the restaurant, so で."}]},
  {title:"へ vs に: direction vs destination",color:"red",layout:"lesson",
    intro:"With going and coming verbs (いく, くる, かえる), both へ and に work. へ leans on the direction ('heading toward'), に on the arrival point. For everyday speech, に is more common.",
    phrases:[
      {jp:"にほん[へ] いきます。",rom:"Nihon e ikimasu.",en:"I'm heading to Japan."},
      {jp:"にほん[に] いきます。",rom:"Nihon ni ikimasu.",en:"I'm going to Japan."}
    ]},
  {title:"と: and / with",color:"red",layout:"lesson",
    phrases:[
      {jp:"パン[と] たまご[を] かいました。",rom:"Pan to tamago wo kaimashita.",en:"I bought bread and eggs."},
      {jp:"ともだち[と] えいが[を] みます。",rom:"Tomodachi to eiga wo mimasu.",en:"I'll watch a movie with my friend."},
      {jp:"ひとり[で] いきます。",rom:"Hitori de ikimasu.",en:"I'll go alone.",note:"'Alone' uses で, not と: ひとりで."}
    ]},
  {title:"から and まで: from, until, because",color:"red",layout:"lesson",
    formula:"A + から + B + まで",
    phrases:[
      {jp:"9じ[から] 5じ[まで] はたらきます。",rom:"Ku-ji kara go-ji made hatarakimasu.",en:"I work from 9 to 5."},
      {jp:"とうきょう[から] おおさか[まで] しんかんせん[で] いきます。",rom:"Toukyou kara Oosaka made shinkansen de ikimasu.",en:"I'll go from Tokyo to Osaka by bullet train."},
      {jp:"さむい です[から]、コート[を] きます。",rom:"Samui desu kara, kooto wo kimasu.",en:"It's cold, so I'll wear a coat.",note:"After a sentence, から means 'because / so'. The reason comes first."}
    ]},
  {header:true,title:"Sentence-ending particles"},
  {title:"か, ね, よ: the feeling at the end",color:"red",layout:"lesson",
    intro:"These go at the very end of the sentence and add tone, a lot like your voice does in English.",
    table:{cols:["Ending","Feeling","Example","English"],speak:2,en:3,rows:[
      ["[か]","asking","おいしい です[か]。|Oishii desu ka?","Is it tasty?"],
      ["[ね]","'right?', shared feeling","おいしい です[ね]。|Oishii desu ne.","It's tasty, isn't it?"],
      ["[よ]","'I'm telling you'","おいしい です[よ]。|Oishii desu yo.","It's tasty, trust me!"],
      ["[よね]","'it is, right?' (checking)","おいしい です[よね]。|Oishii desu yo ne.","It's tasty, right?"]
    ]},
    tip:"Overusing よ can sound pushy. ね is the friendly one: use it to share a reaction (さむいですね = 'cold, isn't it?')."}
]},
{id:"verbs",tab:"Verbs",title:"Verbs",sub:"How Japanese verbs work, the 3 verb groups, and every core conjugation. Open the Conjugator tab to see any verb in every form.",sections:[
  {header:true,title:"The basics"},
  {title:"1. Dictionary form vs ます form",color:"purple",layout:"lesson",
    intro:"Every verb has a <b>dictionary form</b> (plain: たべる) and a polite <b>ます form</b> (たべます). Use ます with strangers, staff and anyone older. Use the plain form with friends and inside longer grammar patterns. Almost every pattern is built from one of a handful of 'base' forms, so learning the conjugations unlocks everything else.",
    table:{cols:["Dictionary","ます form","Meaning"],speak:1,en:2,rows:[
      ["たべる|taberu","たべ{ます}|tabemasu","eat"],
      ["のむ|nomu","のみ{ます}|nomimasu","drink"],
      ["いく|iku","いき{ます}|ikimasu","go"],
      ["みる|miru","み{ます}|mimasu","see, watch"],
      ["する|suru","し{ます}|shimasu","do"],
      ["くる|kuru","き{ます}|kimasu","come"]
    ]},
    tip:"Japanese has no separate future tense. たべます means both 'I eat' and 'I will eat'. Context (or a word like あした) tells you which."},
  {title:"2. The 3 verb groups",color:"purple",layout:"lesson",
    intro:"How a verb conjugates depends on its group. Identify the group first, then apply that group's rule.",
    table:{cols:["Group","Also called","How to spot it","Examples"],rows:[
      ["Group 1","う-verbs (godan)","Ends in any う-sound: う く ぐ す つ ぬ ぶ む る","かう, かく, はなす, まつ, のむ, かえる"],
      ["Group 2","る-verbs (ichidan)","Ends in る, with an e or i sound right before it (〜える / 〜いる)","たべる, ねる, みる, おきる"],
      ["Group 3","irregular","Only two: する and くる (plus any noun + する)","する, くる, べんきょうする"]
    ]},
    mistakes:[{wrong:"かえます (for 'go home')",right:"かえります",why:"Some verbs end in -eru / -iru but are Group 1: かえる (go home), はいる (enter), しる (know), はしる (run), きる (cut). There's no way to tell from the shape. Memorize this short list."}],
    tip:"Shortcut: if you know the ます form, the group shows itself. 〜ります after an e/i sound (かえります) = Group 1. 〜ます straight after the e/i (たべます) = Group 2."},
  {title:"3. Making the ます form",color:"purple",layout:"lesson",
    intro:"<b>Group 1:</b> change the final u-sound to the matching i-sound, then add ます. <b>Group 2:</b> drop る, add ます. <b>Group 3:</b> memorize.",
    phrases:[
      {jp:"のむ→のみます",rom:"nomu - nomimasu",en:"drink (む → み)"},
      {jp:"かく→かきます",rom:"kaku - kakimasu",en:"write (く → き)"},
      {jp:"はなす→はなします",rom:"hanasu - hanashimasu",en:"speak (す → し)"},
      {jp:"まつ→まちます",rom:"matsu - machimasu",en:"wait (つ → ち)"},
      {jp:"かう→かいます",rom:"kau - kaimasu",en:"buy (う → い)"},
      {jp:"かえる→かえります",rom:"kaeru - kaerimasu",en:"go home (る → り, Group 1!)"},
      {jp:"たべる→たべます",rom:"taberu - tabemasu",en:"eat (Group 2: drop る)"},
      {jp:"みる→みます",rom:"miru - mimasu",en:"see (Group 2: drop る)"},
      {jp:"する→します",rom:"suru - shimasu",en:"do (Group 3)"},
      {jp:"くる→きます",rom:"kuru - kimasu",en:"come (Group 3)"}
    ]},
  {header:true,title:"Polite and plain conjugations"},
  {title:"4. The ます family (polite)",color:"purple",layout:"lesson",
    intro:"Everything below is built on the same <b>stem</b>: the part before ます (たべ, のみ, いき). Learn the stem once and you get all of these.",
    table:{cols:["Form","Ending","Example (たべる)","Meaning"],speak:2,en:3,rows:[
      ["Present / future","〜ます","たべ{ます}|tabemasu","eat / will eat"],
      ["Negative","〜ません","たべ{ません}|tabemasen","don't eat / won't eat"],
      ["Past","〜ました","たべ{ました}|tabemashita","ate"],
      ["Past negative","〜ませんでした","たべ{ませんでした}|tabemasen deshita","didn't eat"],
      ["Let's","〜ましょう","たべ{ましょう}|tabemashou","let's eat"],
      ["Invitation","〜ませんか","たべ{ませんか}|tabemasen ka","won't you eat (with me)?"],
      ["Want to","〜たいです","たべ{たいです}|tabetai desu","want to eat"]
    ]}},
  {title:"5. Plain (casual) forms",color:"purple",layout:"lesson",
    intro:"These are what friends use with each other, and they are the building blocks for most grammar patterns (〜と思います, 〜つもり, 〜たことがある...).",
    table:{cols:["Form","のむ (G1)","たべる (G2)","する","くる"],rows:[
      ["Present","のむ|nomu","たべる|taberu","する|suru","くる|kuru"],
      ["Negative","のま{ない}|nomanai","たべ{ない}|tabenai","し{ない}|shinai","こ{ない}|konai"],
      ["Past","のん{だ}|nonda","たべ{た}|tabeta","し{た}|shita","き{た}|kita"],
      ["Past negative","のま{なかった}|nomanakatta","たべ{なかった}|tabenakatta","し{なかった}|shinakatta","こ{なかった}|konakatta"]
    ]},
    mistakes:[{wrong:"かあない (from かう)",right:"かわない",why:"Group 1 ない-form: change u → a, then add ない. But verbs ending in う use わ, not あ: かう → かわない, あう → あわない."},
      {wrong:"あらない (from ある)",right:"ない",why:"ある is special: its negative is just ない."}],
    tip:"The た-form is made exactly like the て-form. Just swap て → た and で → だ: のんで → のんだ, かいて → かいた. Learn the て-form below and you get the past tense for free."},
  {header:true,title:"The て-form (the most important form)"},
  {title:"The 3 groups and their て-form rules",color:"purple",layout:"grammar",phrases:[
    {jp:"て形 (te-kei)",rom:"te-kei",en:"The te-form connects verbs to almost everything - requests, permission, sequences.",note:"Every verb belongs to one of 3 groups, and each group conjugates differently. Learn the group, learn the pattern."},
    {jp:"1グループ - い・ち・り・び・み・に・き・ぎ・し",rom:"Group 1 - u-verbs",en:"Group 1 (u-verbs): the sound the verb ends in decides the te-form ending.",note:"Mnemonic: Group 1 is the 'sound sorter' - listen to the last sound before masu and pick the matching rule below."},
    {jp:"2グループ - e-ます",rom:"Group 2 - ru-verbs",en:"Group 2 (ru-verbs): just drop masu and add te. No sound rules needed.",note:"Mnemonic: Group 2 is the 'lazy group' - always the same simple swap."},
    {jp:"3グループ - します・きます",rom:"Group 3 - irregular",en:"Group 3 (irregular): only two verbs in the whole language - suru and kuru.",note:"Mnemonic: Only 2 verbs total - just memorize します→して and きます→きて cold."}
  ]},
  {title:"Group 1: い・ち・り → って",color:"purple",phrases:[
    {jp:"かいます→かって",rom:"kaimasu - katte",en:"buy - buying / having bought",note:"Mnemonic: い・ち・り all 'trip' and land as って - three different sounds, one identical landing."},
    {jp:"もちます→もって",rom:"mochimasu - motte",en:"hold / carry - holding"},
    {jp:"かえります→かえって",rom:"kaerimasu - kaette",en:"return / go home - returning"}
  ]},
  {title:"Group 1: び・み・に → んで",color:"purple",phrases:[
    {jp:"よびます→よんで",rom:"yobimasu - yonde",en:"call out - calling",note:"Mnemonic: び・み・に are all 'nose sounds' (b/m/n use your nose or lips) - they nasalize into ん, then add で."},
    {jp:"のみます→のんで",rom:"nomimasu - nonde",en:"drink - drinking"}
  ]},
  {title:"Group 1: き → いて",color:"purple",phrases:[
    {jp:"かきます→かいて",rom:"kakimasu - kaite",en:"write - writing",note:"Mnemonic: き softens into いて - the hard 'k' click smooths out."}
  ]},
  {title:"Group 1: ぎ → いで",color:"purple",phrases:[
    {jp:"いそぎます→いそいで",rom:"isogimasu - isoide",en:"hurry - hurrying",note:"Mnemonic: ぎ is just き with a voiced dakuten (＂) - so its te-form is いで instead of いて, same pattern, voiced version."}
  ]},
  {title:"Group 1: し → して",color:"purple",phrases:[
    {jp:"はなします→はなして",rom:"hanashimasu - hanashite",en:"speak / talk - speaking",note:"Mnemonic: the easiest rule - し just becomes して, no twisting needed."}
  ]},
  {title:"Group 1: the one exception",color:"purple",phrases:[
    {jp:"いきます→いって",rom:"ikimasu - itte",en:"go - going",note:"Mnemonic: 行く (iku) SHOULD follow the き→いて rule but breaks it and copies the い・ち・り→って pattern instead. It's the one verb every learner mixes up - drill it separately."}
  ]},
  {title:"Group 2 (る-verbs, e-masu): drop masu, add te",color:"purple",phrases:[
    {jp:"ねます→ねて",rom:"nemasu - nete",en:"sleep - sleeping",note:"Mnemonic: no sound rules for Group 2 - just chop masu and glue on te. Every time."},
    {jp:"たべます→たべて",rom:"tabemasu - tabete",en:"eat - eating"},
    {jp:"みます→みて",rom:"mimasu - mite",en:"see / look - seeing"},
    {jp:"おきます、かります、います など",rom:"okimasu, karimasu, imasu, etc.",en:"wake up, borrow, exist/be - these END in i+masu but are secretly Group 2!",note:"Mnemonic: these LOOK like Group 1 (i-sound before masu) but conjugate like Group 2 instead - おきて, かりて, いて. There's no shortcut, just memorize this short list of imposters."}
  ]},
  {title:"Group 3 (irregular): only 2 verbs to memorize",color:"purple",phrases:[
    {jp:"します→して",rom:"shimasu - shite",en:"do - doing",note:"Mnemonic: する is used in tons of compound verbs (べんきょうする, かいものする) - nail this one and you unlock dozens of others."},
    {jp:"きます→きて",rom:"kimasu - kite",en:"come - coming",note:"Mnemonic: 来ます(kuru, to come) is irregular - don't confuse it with 聞きます(kikimasu, to listen) which is a normal Group 1 き→いて verb!"}
  ]},
  {header:true,title:"More forms (N4)"},
  {title:"Potential: can do",color:"purple",layout:"lesson",
    intro:"<b>Group 1:</b> u → e, add る (のむ → のめる). <b>Group 2:</b> drop る, add られる (たべる → たべられる). <b>する → できる</b>, <b>くる → こられる</b>. The result is a Group 2 verb, so it conjugates on: のめます, のめません.",
    phrases:[
      {jp:"のむ→のめる",rom:"nomu - nomeru",en:"can drink"},
      {jp:"はなす→はなせる",rom:"hanasu - hanaseru",en:"can speak"},
      {jp:"たべる→たべられる",rom:"taberu - taberareru",en:"can eat"},
      {jp:"する→できる",rom:"suru - dekiru",en:"can do"},
      {jp:"にほんご[が] すこし はなせ{ます}。",rom:"Nihongo ga sukoshi hanasemasu.",en:"I can speak a little Japanese.",note:"With potential verbs, the object usually switches from を to が."}
    ]},
  {title:"Volitional: let's (casual) / I'll",color:"purple",layout:"lesson",
    intro:"The casual version of ましょう. <b>Group 1:</b> u → o, add う (いく → いこう). <b>Group 2:</b> drop る, add よう (たべる → たべよう). <b>する → しよう</b>, <b>くる → こよう</b>.",
    phrases:[
      {jp:"いく→いこう",rom:"iku - ikou",en:"let's go"},
      {jp:"たべる→たべよう",rom:"taberu - tabeyou",en:"let's eat"},
      {jp:"する→しよう",rom:"suru - shiyou",en:"let's do it"},
      {jp:"いっしょに いこう！",rom:"Issho ni ikou!",en:"Let's go together!"}
    ]},
  {title:"Conditionals: ば and たら",color:"purple",layout:"lesson",
    intro:"<b>ば:</b> Group 1 u → e, add ば (いく → いけば). Group 2 drop る, add れば (たべる → たべれば). する → すれば, くる → くれば.<br><b>たら:</b> take the plain past (た-form) and add ら (いった → いったら). Works for every verb.",
    phrases:[
      {jp:"いく→いけば",rom:"iku - ikeba",en:"if (I) go"},
      {jp:"いく→いったら",rom:"iku - ittara",en:"if / when (I) go"},
      {jp:"たべる→たべれば",rom:"taberu - tabereba",en:"if (I) eat"},
      {jp:"たべる→たべたら",rom:"taberu - tabetara",en:"if / when (I) eat"}
    ],
    tip:"When unsure which 'if' to use, たら is the safest and most flexible. See Sentence Patterns for how each one is used."},
  {title:"Passive and causative",color:"purple",layout:"lesson",
    intro:"<b>Passive</b> (is done / had done to me): Group 1 u → a, add れる (よむ → よまれる). Group 2 drop る, add られる. する → される, くる → こられる.<br><b>Causative</b> (make / let someone do): Group 1 u → a, add せる (よむ → よませる). Group 2 drop る, add させる. する → させる, くる → こさせる. For verbs ending in う, the a-sound is わ: かう → かわれる / かわせる.",
    phrases:[
      {jp:"よむ→よまれる",rom:"yomu - yomareru",en:"is read (passive)"},
      {jp:"よむ→よませる",rom:"yomu - yomaseru",en:"make / let read (causative)"},
      {jp:"たべる→たべられる",rom:"taberu - taberareru",en:"is eaten (passive; same shape as potential)"},
      {jp:"たべる→たべさせる",rom:"taberu - tabesaseru",en:"make / let eat (causative)"}
    ]}
]},
{id:"adjectives",tab:"Adjectives",title:"Adjectives",sub:"Japanese has two kinds of adjectives, and they conjugate differently. Learn the type and you know every form.",sections:[
  {header:true,title:"The two types"},
  {title:"1. い-adjectives vs な-adjectives",color:"amber",layout:"lesson",
    intro:"<b>い-adjectives</b> end in い and conjugate themselves, like verbs (おいしい → おいしくない). <b>な-adjectives</b> behave like nouns: they use です / じゃない after them, and take な before a noun (しずか<b>な</b> へや).",
    table:{cols:["Type","Before a noun","After it (sentence end)","Examples"],rows:[
      ["い-adjective","おいしい ラーメン|oishii raamen","おいしい です|oishii desu","おおきい, たかい, あつい, たのしい"],
      ["な-adjective","しずか{な} へや|shizuka na heya","しずか です|shizuka desu","しずか, げんき, べんり, すき"]
    ]},
    mistakes:[{wrong:"きれくない",right:"きれいじゃない",why:"きれい, きらい and ゆうめい end in い but are な-adjectives. These three are the classic traps."}]},
  {header:true,title:"Conjugation tables"},
  {title:"2. い-adjective conjugation",color:"amber",layout:"lesson",
    intro:"Drop the final い and add a new ending. For polite speech, put です after any of these.",
    table:{cols:["Form","Rule","Example (たかい)","English"],speak:2,en:3,rows:[
      ["Present","〜い","たか{い}|takai","is expensive"],
      ["Negative","い → くない","たか{くない}|takakunai","isn't expensive"],
      ["Past","い → かった","たか{かった}|takakatta","was expensive"],
      ["Past negative","い → くなかった","たか{くなかった}|takakunakatta","wasn't expensive"],
      ["て-form (and...)","い → くて","たか{くて}|takakute","is expensive, and..."],
      ["Adverb","い → く","はや{く}|hayaku","quickly / early (from はやい)"]
    ]},
    mistakes:[{wrong:"たかいでした",right:"たかかったです",why:"い-adjectives carry their own tense. Change the adjective to past, then add です. Never put でした after an い-adjective."}]},
  {title:"3. The irregular one: いい (good)",color:"amber",layout:"lesson",
    intro:"いい comes from an older word, よい, and every form except the present uses よ.",
    table:{cols:["Form","いい (good)","English"],speak:1,en:2,rows:[
      ["Present","いい|ii","is good"],
      ["Negative","{よ}くない|yokunai","isn't good"],
      ["Past","{よ}かった|yokatta","was good"],
      ["Past negative","{よ}くなかった|yokunakatta","wasn't good"],
      ["て-form","{よ}くて|yokute","is good, and..."]
    ]},
    tip:"かっこいい (cool) ends in いい, so it follows the same pattern: かっこよかった (it was cool)."},
  {title:"4. な-adjective conjugation",color:"amber",layout:"lesson",
    intro:"な-adjectives never change. Only the ending after them changes, exactly like nouns.",
    table:{cols:["Form","Polite","Plain","English"],speak:1,en:3,rows:[
      ["Present","しずか{です}|shizuka desu","しずか{だ}|shizuka da","is quiet"],
      ["Negative","しずか{じゃありません}|shizuka ja arimasen","しずか{じゃない}|shizuka ja nai","isn't quiet"],
      ["Past","しずか{でした}|shizuka deshita","しずか{だった}|shizuka datta","was quiet"],
      ["Past negative","しずか{じゃありませんでした}|shizuka ja arimasen deshita","しずか{じゃなかった}|shizuka ja nakatta","wasn't quiet"],
      ["て-form (and...)","しずか{で}|shizuka de","しずか{で}|shizuka de","is quiet, and..."],
      ["Adverb","しずか{に}|shizuka ni","しずか{に}|shizuka ni","quietly"],
      ["Before a noun","しずか{な} へや|shizuka na heya","しずか{な} へや|shizuka na heya","a quiet room"]
    ]}},
  {header:true,title:"Using adjectives in sentences"},
  {title:"5. Adjective sentences",color:"amber",layout:"lesson",
    phrases:[
      {jp:"この ラーメン[は] おいしい です。",rom:"Kono raamen wa oishii desu.",en:"This ramen is delicious."},
      {jp:"きのう[は] さむ{かった} です。",rom:"Kinou wa samukatta desu.",en:"It was cold yesterday."},
      {jp:"この へや[は] しずか{じゃありません}。",rom:"Kono heya wa shizuka ja arimasen.",en:"This room isn't quiet."},
      {jp:"にほん[は] きれい{な} くに です。",rom:"Nihon wa kirei na kuni desu.",en:"Japan is a beautiful country."},
      {jp:"わたし[は] ねこ[が] すき です。",rom:"Watashi wa neko ga suki desu.",en:"I like cats.",note:"すき / きらい / じょうず / へた take が for the thing."}
    ]},
  {title:"6. Linking adjectives: くて and で",color:"amber",layout:"lesson",
    intro:"To say 'X and Y', put the first adjective in its て-form. い-adjectives: い → くて. な-adjectives: add で.",
    formula:"い-adj (くて) / な-adj (で) + Adjective",
    phrases:[
      {jp:"やす{くて} おいしい レストラン です。",rom:"Yasukute oishii resutoran desu.",en:"It's a cheap and tasty restaurant."},
      {jp:"しずか{で} きれい{な} こうえん です。",rom:"Shizuka de kirei na kouen desu.",en:"It's a quiet, pretty park."},
      {jp:"この へや[は] ひろ{くて} あかるい です。",rom:"Kono heya wa hirokute akarui desu.",en:"This room is spacious and bright."}
    ]},
  {title:"7. Becoming: くなる and になる",color:"amber",layout:"lesson",
    intro:"なる means 'to become'. い-adjectives change い → く, then なる. な-adjectives and nouns add に, then なる.",
    formula:"い-adj (く) / な-adj or Noun (に) + なる",
    phrases:[
      {jp:"さむ{く} なりました。",rom:"Samuku narimashita.",en:"It got cold."},
      {jp:"にほんご[が] じょうず{に} なりました。",rom:"Nihongo ga jouzu ni narimashita.",en:"My Japanese got better."},
      {jp:"げんき{に} なりました。",rom:"Genki ni narimashita.",en:"I got better (recovered)."},
      {jp:"いしゃ{に} なりたい です。",rom:"Isha ni naritai desu.",en:"I want to become a doctor."}
    ]},
  {header:true,title:"Common adjectives"},
  {title:"い-adjectives to know",color:"amber",phrases:[
    {jp:"おおきい",rom:"ookii",en:"big"},{jp:"ちいさい",rom:"chiisai",en:"small"},
    {jp:"たかい",rom:"takai",en:"expensive; tall"},{jp:"やすい",rom:"yasui",en:"cheap"},
    {jp:"あたらしい",rom:"atarashii",en:"new"},{jp:"ふるい",rom:"furui",en:"old (things)"},
    {jp:"あつい",rom:"atsui",en:"hot (weather)"},{jp:"さむい",rom:"samui",en:"cold (weather)"},
    {jp:"たのしい",rom:"tanoshii",en:"fun"},{jp:"むずかしい",rom:"muzukashii",en:"difficult"},
    {jp:"いそがしい",rom:"isogashii",en:"busy"},{jp:"ちかい",rom:"chikai",en:"near"},
    {jp:"とおい",rom:"tooi",en:"far"},{jp:"いい",rom:"ii",en:"good (irregular: よくない, よかった)"}
  ]},
  {title:"な-adjectives to know",color:"amber",phrases:[
    {jp:"しずか",rom:"shizuka",en:"quiet"},{jp:"げんき",rom:"genki",en:"healthy, energetic"},
    {jp:"べんり",rom:"benri",en:"convenient"},{jp:"だいじょうぶ",rom:"daijoubu",en:"okay, all right"},
    {jp:"すき",rom:"suki",en:"liked (I like...)"},{jp:"じょうず",rom:"jouzu",en:"good at, skilled"},
    {jp:"へた",rom:"heta",en:"bad at"},{jp:"ひま",rom:"hima",en:"free (not busy)"},
    {jp:"たいへん",rom:"taihen",en:"tough, hard"},
    {jp:"きれい",rom:"kirei",en:"pretty; clean",note:"Trap: ends in い, but it's a な-adjective."},
    {jp:"きらい",rom:"kirai",en:"disliked",note:"Trap: ends in い, but it's a な-adjective."},
    {jp:"ゆうめい",rom:"yuumei",en:"famous",note:"Trap: ends in い, but it's a な-adjective."}
  ]}
]},
{id:"patterns",tab:"Sentence Patterns",title:"Sentence Patterns",sub:"The grammar patterns that turn single words into real sentences. Each one shows how it's built, so you can plug in any verb.",sections:[
  {header:true,title:"Requests and permission"},
  {title:"〜てください: please do",color:"purple",layout:"lesson",
    intro:"The polite way to ask someone to do something. Built from the て-form.",
    formula:"Verb (て-form) + ください",
    phrases:[
      {jp:"ちょっと まって{ください}。",rom:"Chotto matte kudasai.",en:"Please wait a moment."},
      {jp:"もう いちど いって{ください}。",rom:"Mou ichido itte kudasai.",en:"Please say it once more."},
      {jp:"ここ[に] なまえ[を] かいて{ください}。",rom:"Koko ni namae wo kaite kudasai.",en:"Please write your name here."}
    ]},
  {title:"〜ないでください: please don't",color:"purple",layout:"lesson",
    formula:"Verb (ない-form) + でください",
    phrases:[
      {jp:"ここ[で] しゃしん[を] とらない{でください}。",rom:"Koko de shashin wo toranaide kudasai.",en:"Please don't take photos here."},
      {jp:"わすれない{でください}。",rom:"Wasurenaide kudasai.",en:"Please don't forget."}
    ]},
  {title:"〜てもいいですか: may I?",color:"purple",layout:"lesson",
    formula:"Verb (て-form) + もいいですか",
    phrases:[
      {jp:"しゃしん[を] とって{もいいですか}。",rom:"Shashin wo totte mo ii desu ka?",en:"May I take a photo?"},
      {jp:"ここ[に] すわって{もいいですか}。",rom:"Koko ni suwatte mo ii desu ka?",en:"May I sit here?"},
      {jp:"はい、どうぞ。",rom:"Hai, douzo.",en:"Yes, go ahead."},
      {jp:"すみません、ちょっと…",rom:"Sumimasen, chotto...",en:"Sorry, that's a bit... (polite no)"}
    ]},
  {title:"〜てはいけません: must not",color:"purple",layout:"lesson",
    formula:"Verb (て-form) + はいけません",
    phrases:[
      {jp:"ここ[で] たばこ[を] すって{はいけません}。",rom:"Koko de tabako wo sutte wa ikemasen.",en:"You must not smoke here."},
      {jp:"でんしゃ[で] でんわ[を] して{はいけません}。",rom:"Densha de denwa wo shite wa ikemasen.",en:"You must not talk on the phone on the train."}
    ],
    tip:"In casual speech you'll hear 〜ちゃだめ: すっちゃだめ ('don't smoke!')."},
  {header:true,title:"Wants, plans and invitations"},
  {title:"〜たいです: want to do",color:"purple",layout:"lesson",
    intro:"Take the ます-stem (the part before ます) and add たい. たい then conjugates like an い-adjective.",
    formula:"Verb (ます-stem) + たいです",
    phrases:[
      {jp:"にほん[に] また いき{たいです}。",rom:"Nihon ni mata ikitai desu.",en:"I want to go to Japan again."},
      {jp:"なに[を] たべ{たいですか}。",rom:"Nani wo tabetai desu ka?",en:"What do you want to eat?"},
      {jp:"きょう[は] なに[も] し{たくないです}。",rom:"Kyou wa nani mo shitakunai desu.",en:"I don't want to do anything today."},
      {jp:"ずっと いき{たかったです}。",rom:"Zutto ikitakatta desu.",en:"I always wanted to go."}
    ],
    tip:"たい is only for YOUR OWN wants (or asking someone directly). For a third person, say 〜たがっています: ともだちは いきたがっています (my friend wants to go)."},
  {title:"〜がほしいです: want a thing",color:"purple",layout:"lesson",
    intro:"たい is for wanting to DO something. ほしい is for wanting to HAVE something (a noun).",
    formula:"Noun + が + ほしいです",
    phrases:[
      {jp:"あたらしい スマホ[が] ほしい です。",rom:"Atarashii sumaho ga hoshii desu.",en:"I want a new smartphone."},
      {jp:"なに[が] ほしい ですか。",rom:"Nani ga hoshii desu ka?",en:"What do you want?"}
    ]},
  {title:"〜ましょう / 〜ましょうか: let's / shall I?",color:"purple",layout:"lesson",
    formula:"Verb (ます-stem) + ましょう(か)",
    phrases:[
      {jp:"いっしょに たべ{ましょう}。",rom:"Issho ni tabemashou.",en:"Let's eat together."},
      {jp:"てつだい{ましょうか}。",rom:"Tetsudaimashou ka?",en:"Shall I help you?"},
      {jp:"なんじ[に] あい{ましょうか}。",rom:"Nanji ni aimashou ka?",en:"What time shall we meet?"}
    ]},
  {title:"〜ませんか: won't you...? (invitation)",color:"purple",layout:"lesson",
    intro:"A negative question makes a softer, more polite invitation than ましょう. It gives the other person room to say no.",
    formula:"Verb (ます-stem) + ませんか",
    phrases:[
      {jp:"いっしょに えいが[を] み{ませんか}。",rom:"Issho ni eiga wo mimasen ka?",en:"Would you like to watch a movie together?"},
      {jp:"いいですね！",rom:"Ii desu ne!",en:"Sounds good!"}
    ]},
  {title:"〜つもりです: plan to",color:"purple",layout:"lesson",
    formula:"Verb (dictionary form) + つもりです",
    phrases:[
      {jp:"らいねん また にほん[に] いく{つもりです}。",rom:"Rainen mata Nihon ni iku tsumori desu.",en:"I plan to go to Japan again next year."},
      {jp:"まいにち べんきょうする{つもりです}。",rom:"Mainichi benkyou suru tsumori desu.",en:"I intend to study every day."},
      {jp:"もう のまない{つもりです}。",rom:"Mou nomanai tsumori desu.",en:"I plan not to drink anymore.",note:"Plan NOT to: ない-form + つもり."}
    ]},
  {title:"〜(よ)うと思っています: I'm thinking of doing",color:"purple",layout:"lesson",
    formula:"Verb (volitional) + とおもっています",
    phrases:[
      {jp:"にほんご[の] がっこう[に] はいろう{とおもっています}。",rom:"Nihongo no gakkou ni hairou to omotte imasu.",en:"I'm thinking of enrolling in a Japanese school."},
      {jp:"らいげつ きょうと[に] いこう{とおもっています}。",rom:"Raigetsu Kyouto ni ikou to omotte imasu.",en:"I'm thinking of going to Kyoto next month."}
    ]},
  {header:true,title:"Ongoing actions, states and experience"},
  {title:"〜ています: is doing (right now)",color:"purple",layout:"lesson",
    formula:"Verb (て-form) + います",
    phrases:[
      {jp:"いま ばんごはん[を] たべて{います}。",rom:"Ima bangohan wo tabete imasu.",en:"I'm eating dinner right now."},
      {jp:"なに[を] して{いますか}。",rom:"Nani wo shite imasu ka?",en:"What are you doing?"}
    ]},
  {title:"〜ています: ongoing state or habit",color:"purple",layout:"lesson",
    intro:"With some verbs, ている describes a state that resulted from an action (married, living somewhere, knowing someone), or something you do regularly.",
    phrases:[
      {jp:"けっこん して{います}。",rom:"Kekkon shite imasu.",en:"I'm married."},
      {jp:"とうきょう[に] すんで{います}。",rom:"Toukyou ni sunde imasu.",en:"I live in Tokyo."},
      {jp:"まいにち ジム[に] かよって{います}。",rom:"Mainichi jimu ni kayotte imasu.",en:"I go to the gym every day."},
      {jp:"たなかさん[を] しって{いますか}。",rom:"Tanaka-san wo shitte imasu ka?",en:"Do you know Tanaka?"},
      {jp:"いいえ、しりません。",rom:"Iie, shirimasen.",en:"No, I don't.",note:"Trap: 'I don't know' is しりません, NOT しっていません."}
    ]},
  {title:"〜たことがあります: have done before",color:"purple",layout:"lesson",
    intro:"Talks about life experience: something you have done at least once.",
    formula:"Verb (た-form) + ことがあります",
    phrases:[
      {jp:"すし[を] たべた{ことがあります}。",rom:"Sushi wo tabeta koto ga arimasu.",en:"I have eaten sushi before."},
      {jp:"ふじさん[に] のぼった{ことがありますか}。",rom:"Fujisan ni nobotta koto ga arimasu ka?",en:"Have you ever climbed Mt. Fuji?"},
      {jp:"いちど[も] いった{ことがありません}。",rom:"Ichido mo itta koto ga arimasen.",en:"I've never been there, not even once."}
    ],
    tip:"Don't use this with a specific time like きのう. 'I ate sushi yesterday' is just すしを たべました。"},
  {title:"〜てみます: try doing",color:"purple",layout:"lesson",
    formula:"Verb (て-form) + みます",
    phrases:[
      {jp:"なっとう[を] たべて{みました}。",rom:"Nattou wo tabete mimashita.",en:"I tried eating natto."},
      {jp:"これ、きて{みてもいいですか}。",rom:"Kore, kite mite mo ii desu ka?",en:"May I try this on?"}
    ]},
  {header:true,title:"Connecting sentences"},
  {title:"て-form chains: and then",color:"purple",layout:"lesson",
    intro:"Link actions in order with the て-form. Only the LAST verb shows tense and politeness, and it sets the tense for the whole sentence.",
    formula:"Verb (て-form) + Verb (て-form) + Verb (ます)",
    phrases:[
      {jp:"あさ おきて、シャワー[を] あびて、がっこう[に] いきます。",rom:"Asa okite, shawaa wo abite, gakkou ni ikimasu.",en:"I get up, shower, and go to school."},
      {jp:"きのう[は] しんじゅく[に] いって、かいもの[を] しました。",rom:"Kinou wa Shinjuku ni itte, kaimono wo shimashita.",en:"Yesterday I went to Shinjuku and shopped."}
    ]},
  {title:"〜てから: after doing",color:"purple",layout:"lesson",
    formula:"Verb (て-form) + から",
    phrases:[
      {jp:"しゅくだい[を] して{から}、ゲーム[を] します。",rom:"Shukudai wo shite kara, geemu wo shimasu.",en:"After I do my homework, I'll play games."},
      {jp:"て[を] あらって{から}、たべて ください。",rom:"Te wo aratte kara, tabete kudasai.",en:"Please wash your hands before you eat (after washing, eat)."}
    ]},
  {title:"〜から: because / so",color:"purple",layout:"lesson",
    intro:"The REASON comes first, then から, then the result. That's the reverse of English 'because'.",
    formula:"Reason + から + Result",
    phrases:[
      {jp:"じかん[が] ありません{から}、タクシー[で] いきます。",rom:"Jikan ga arimasen kara, takushii de ikimasu.",en:"I don't have time, so I'll go by taxi."},
      {jp:"どうして きませんでしたか。",rom:"Doushite kimasen deshita ka?",en:"Why didn't you come?"},
      {jp:"いそがしかった{からです}。",rom:"Isogashikatta kara desu.",en:"Because I was busy."}
    ],
    tip:"〜ので also means 'because'. It sounds softer and more objective, which makes it good for explaining or apologizing: ちょっと ぐあいが わるいので、やすみます。"},
  {title:"〜が / 〜けど: but",color:"purple",layout:"lesson",
    formula:"Sentence 1 + が / けど + Sentence 2",
    phrases:[
      {jp:"にほんご[は] むずかしい です{が}、おもしろい です。",rom:"Nihongo wa muzukashii desu ga, omoshiroi desu.",en:"Japanese is difficult, but interesting."},
      {jp:"たかい{けど}、かいます。",rom:"Takai kedo, kaimasu.",en:"It's expensive, but I'll buy it."}
    ],
    tip:"が is a bit more formal, けど more casual. Both also soften a request or opener: すみませんが、えきは どこですか。"},
  {title:"〜たり〜たりします: do things like A and B",color:"purple",layout:"lesson",
    formula:"Verb (た-form) + り + Verb (た-form) + り + します",
    phrases:[
      {jp:"しゅうまつ[は] えいが[を] みた{り}、ともだち[に] あった{り} します。",rom:"Shuumatsu wa eiga wo mitari, tomodachi ni attari shimasu.",en:"On weekends I do things like watch movies and see friends."}
    ]},
  {title:"〜ながら: while doing",color:"purple",layout:"lesson",
    intro:"Both actions happen at the same time. The MAIN action is the second verb.",
    formula:"Verb (ます-stem) + ながら + Main verb",
    phrases:[
      {jp:"おんがく[を] きき{ながら} べんきょうします。",rom:"Ongaku wo kikinagara benkyou shimasu.",en:"I study while listening to music."}
    ]},
  {title:"〜まえに / 〜あとで: before / after",color:"purple",layout:"lesson",
    formula:"Verb (dictionary) + まえに  /  Verb (た-form) + あとで",
    phrases:[
      {jp:"ねる{まえに} は[を] みがきます。",rom:"Neru mae ni ha wo migakimasu.",en:"I brush my teeth before going to bed."},
      {jp:"ごはん[を] たべた{あとで} さんぽ[を] します。",rom:"Gohan wo tabeta ato de sanpo wo shimasu.",en:"After eating, I take a walk."},
      {jp:"しょくじ[の] まえに",rom:"shokuji no mae ni",en:"before the meal",note:"With nouns, add の: Noun + の + まえに / あとで."}
    ],
    tip:"Before uses the dictionary form (it hasn't happened yet). After uses the た-form (it already happened)."},
  {header:true,title:"Obligation and advice"},
  {title:"〜なければなりません: must, have to",color:"purple",layout:"lesson",
    intro:"Take the ない-form, drop the final い, and add ければなりません. It literally means 'if I don't, it won't do'.",
    formula:"Verb (ない-form minus い) + ければなりません",
    phrases:[
      {jp:"あした はやく おきな{ければなりません}。",rom:"Ashita hayaku okinakereba narimasen.",en:"I have to get up early tomorrow."},
      {jp:"もう かえらな{きゃ}。",rom:"Mou kaeranakya.",en:"I've gotta go home now.",note:"Casual speech shortens it to 〜なきゃ."}
    ]},
  {title:"〜なくてもいいです: don't have to",color:"purple",layout:"lesson",
    formula:"Verb (ない-form minus い) + くてもいいです",
    phrases:[
      {jp:"くつ[を] ぬがな{くてもいいです}。",rom:"Kutsu wo nuganakute mo ii desu.",en:"You don't have to take off your shoes."}
    ]},
  {title:"〜たほうがいいです: you'd better / should",color:"purple",layout:"lesson",
    formula:"Verb (た-form) + ほうがいいです",
    phrases:[
      {jp:"はやく ねた{ほうがいいです}よ。",rom:"Hayaku neta hou ga ii desu yo.",en:"You should go to bed early."},
      {jp:"むり しない{ほうがいいです}よ。",rom:"Muri shinai hou ga ii desu yo.",en:"You shouldn't push yourself too hard.",note:"Advice NOT to do something uses the ない-form."}
    ]},
  {header:true,title:"Ability and comparison"},
  {title:"Can do: potential and ことができます",color:"purple",layout:"lesson",
    intro:"Two ways to say 'can'. The potential form (はなせます) is everyday speech. Dictionary form + ことができます is a bit more formal and works for every verb.",
    formula:"Verb (dictionary) + ことができます",
    phrases:[
      {jp:"にほんご[が] すこし はなせます。",rom:"Nihongo ga sukoshi hanasemasu.",en:"I can speak a little Japanese."},
      {jp:"およぐ{ことができます}。",rom:"Oyogu koto ga dekimasu.",en:"I can swim."},
      {jp:"かんじ[が] よめますか。",rom:"Kanji ga yomemasu ka?",en:"Can you read kanji?"}
    ]},
  {title:"Comparisons: より, どちら, いちばん",color:"purple",layout:"lesson",
    formula:"A + は + B + より + Adjective",
    phrases:[
      {jp:"とうきょう[は] おおさか{より} おおきい です。",rom:"Toukyou wa Oosaka yori ookii desu.",en:"Tokyo is bigger than Osaka."},
      {jp:"すし[と] ラーメン[と] {どちらが} すき ですか。",rom:"Sushi to raamen to dochira ga suki desu ka?",en:"Which do you like more, sushi or ramen?"},
      {jp:"ラーメン{のほうが} すき です。",rom:"Raamen no hou ga suki desu.",en:"I like ramen more."},
      {jp:"にほん[の] たべもの[で] なに[が] {いちばん} すき ですか。",rom:"Nihon no tabemono de nani ga ichiban suki desu ka?",en:"Of Japanese foods, what do you like most?"},
      {jp:"すし[が] {いちばん} すき です。",rom:"Sushi ga ichiban suki desu.",en:"I like sushi the most."}
    ]},
  {header:true,title:"Conditionals: if and when"},
  {title:"〜たら: if / when (the all-purpose one)",color:"purple",layout:"lesson",
    formula:"Verb / Adjective (past, た) + ら",
    phrases:[
      {jp:"にほん[に] いった{ら}、きょうと[に] いきたい です。",rom:"Nihon ni ittara, Kyouto ni ikitai desu.",en:"When I go to Japan, I want to go to Kyoto."},
      {jp:"あめ[が] ふった{ら}、うち[に] います。",rom:"Ame ga futtara, uchi ni imasu.",en:"If it rains, I'll stay home."},
      {jp:"やすかった{ら}、かいます。",rom:"Yasukattara, kaimasu.",en:"If it's cheap, I'll buy it."}
    ],
    tip:"たら is the most flexible 'if'. When in doubt, use it."},
  {title:"〜と: whenever / it always happens",color:"purple",layout:"lesson",
    intro:"For natural results, instructions and directions: when A happens, B automatically follows. The second half can't be a request or a wish.",
    formula:"Verb (dictionary) + と + Result",
    phrases:[
      {jp:"この ボタン[を] おす{と}、ドア[が] あきます。",rom:"Kono botan wo osu to, doa ga akimasu.",en:"When you press this button, the door opens."},
      {jp:"みぎ[に] まがる{と}、えき[が] あります。",rom:"Migi ni magaru to, eki ga arimasu.",en:"Turn right and you'll find the station."}
    ]},
  {title:"〜ば: if (condition)",color:"purple",layout:"lesson",
    formula:"Verb (ば-form) + Result",
    phrases:[
      {jp:"はやく いけ{ば}、まにあいます。",rom:"Hayaku ikeba, maniaimasu.",en:"If you go early, you'll make it in time."},
      {jp:"やすけれ{ば} かいます。",rom:"Yasukereba kaimasu.",en:"If it's cheap, I'll buy it.",note:"い-adjectives: い → ければ."}
    ]},
  {header:true,title:"Thoughts, speech and degree"},
  {title:"〜と思います: I think",color:"purple",layout:"lesson",
    intro:"Put the plain form before と思います. For nouns and な-adjectives, add だ first.",
    formula:"Plain form + とおもいます",
    phrases:[
      {jp:"あした[は] あめ[が] ふる{とおもいます}。",rom:"Ashita wa ame ga furu to omoimasu.",en:"I think it'll rain tomorrow."},
      {jp:"この みせ[は] たかい{とおもいます}。",rom:"Kono mise wa takai to omoimasu.",en:"I think this shop is expensive."},
      {jp:"あの ひと[は] がくせい{だとおもいます}。",rom:"Ano hito wa gakusei da to omoimasu.",en:"I think that person is a student."}
    ]},
  {title:"〜と言いました: said that",color:"purple",layout:"lesson",
    formula:"Plain form + といいました",
    phrases:[
      {jp:"たなかさん[は] あした くる{といいました}。",rom:"Tanaka-san wa ashita kuru to iimashita.",en:"Tanaka said he'd come tomorrow."}
    ]},
  {title:"〜すぎます: too much",color:"purple",layout:"lesson",
    formula:"Verb (ます-stem) / Adjective (drop い or な) + すぎます",
    phrases:[
      {jp:"たべ{すぎました}。",rom:"Tabesugimashita.",en:"I ate too much."},
      {jp:"この くつ[は] おおき{すぎます}。",rom:"Kono kutsu wa ookisugimasu.",en:"These shoes are too big."},
      {jp:"この へや[は] しずか{すぎます}。",rom:"Kono heya wa shizukasugimasu.",en:"This room is too quiet."}
    ]},
  {title:"〜でしょう / 〜かもしれません: probably / might",color:"purple",layout:"lesson",
    formula:"Plain form + でしょう / かもしれません",
    phrases:[
      {jp:"あした[は] はれる{でしょう}。",rom:"Ashita wa hareru deshou.",en:"It will probably be sunny tomorrow."},
      {jp:"あめ[が] ふる{かもしれません}。",rom:"Ame ga furu kamoshiremasen.",en:"It might rain."}
    ]}
]},

{id:"drill",tab:"Conjugation Drill",title:"__DRILL__",sub:"",sections:[]},
{id:"numbers",tab:"Numbers",title:"Numbers",sub:"Prices, times, floors, ordering quantities, and counting people",sections:[
  {title:"1 through 10 - memorize these first",color:"blue",grid:true,phrases:[
    {jp:"いち",rom:"ichi",en:"1"},
    {jp:"に",rom:"ni",en:"2"},
    {jp:"さん",rom:"san",en:"3"},
    {jp:"よん / し",rom:"yon / shi",en:"4",note:"Both readings used"},
    {jp:"ご",rom:"go",en:"5"},
    {jp:"ろく",rom:"roku",en:"6"},
    {jp:"なな / しち",rom:"nana / shichi",en:"7",note:"Both readings used"},
    {jp:"はち",rom:"hachi",en:"8"},
    {jp:"きゅう / く",rom:"kyuu / ku",en:"9",note:"Both readings used"},
    {jp:"じゅう",rom:"juu",en:"10"}
  ]},
  {title:"Bigger numbers",color:"blue",grid:true,phrases:[
    {jp:"じゅういち",rom:"juuichi",en:"11"},
    {jp:"にじゅう",rom:"nijuu",en:"20"},
    {jp:"さんじゅうよん",rom:"sanjuuyon",en:"34"},
    {jp:"ひゃく",rom:"hyaku",en:"100"},
    {jp:"せん",rom:"sen",en:"1000"},
    {jp:"いちまん",rom:"ichiman",en:"10000"}
  ]},
  {title:"Counting items for ordering food",color:"",grid:true,phrases:[
    {jp:"ひとつ",rom:"hitotsu",en:"1 item"},
    {jp:"ふたつ",rom:"futatsu",en:"2 items"},
    {jp:"みっつ",rom:"mittsu",en:"3 items"},
    {jp:"よっつ",rom:"yottsu",en:"4 items"},
    {jp:"いつつ",rom:"itsutsu",en:"5 items"}
  ]},
  {title:"Counting PEOPLE - nin",color:"blue",grid:true,phrases:[
    {jp:"ひとり",rom:"hitori",en:"1 person",note:"Mnemonic: hitori = hito(person) + ri. It is NOT ichinin - the counter just fuses with the word for person."},
    {jp:"ふたり",rom:"futari",en:"2 people",note:"Mnemonic: futari = futa(two, as in futatsu) + ri, matching hitori's pattern. Use this at every restaurant."},
    {jp:"さんにん",rom:"san-nin",en:"3 people"},
    {jp:"よにん",rom:"yo-nin",en:"4 people",note:"Use yo not shi - shinin means something else!"},
    {jp:"ごにん",rom:"go-nin",en:"5 people"},
    {jp:"ろくにん",rom:"roku-nin",en:"6 people"},
    {jp:"しちにん / ななにん",rom:"shichi-nin / nana-nin",en:"7 people"},
    {jp:"はちにん",rom:"hachi-nin",en:"8 people"},
    {jp:"きゅうにん",rom:"kyuu-nin",en:"9 people"},
    {jp:"じゅうにん",rom:"juu-nin",en:"10 people"},
    {jp:"なんにん",rom:"nan-nin",en:"How many people?",note:"Staff will ask you this at restaurants!"}
  ]},
  {title:"Counting people in sentences",color:"",phrases:[
    {jp:"ひとりです。",rom:"Hitori desu.",en:"One person. Just me.",role:"you"},
    {jp:"ふたりです。",rom:"Futari desu.",en:"Two people please.",note:"The phrase from your restaurant lesson!",role:"you"},
    {jp:"さんにんです。",rom:"San-nin desu.",en:"Three people.",role:"you"},
    {jp:"よにんです。",rom:"Yo-nin desu.",en:"Four people.",role:"you"},
    {jp:"おとな ふたりと こども ひとりです。",rom:"Otona futari to kodomo hitori desu.",en:"Two adults and one child.",note:"otona = adult kodomo = child to = and",role:"you"},
    {jp:"おとな ひとり おねがいします。",rom:"Otona hitori onegaishimasu.",en:"One adult please. For example buying a ticket",role:"you"},
    {jp:"なんめいさまですか？",rom:"Nanmeisama desuka?",en:"How many people in your party?",note:"Formal restaurant greeting!",role:"staff"}
  ]},
  {title:"The two irregular counters - must memorize!",color:"amber",phrases:[
    {jp:"ひとり (1人)",rom:"hitori",en:"1 person - completely unique word NOT ichinichi"},
    {jp:"ふたり (2人)",rom:"futari",en:"2 people - completely unique word NOT ninin"},
    {jp:"さんにん (3人)",rom:"san-nin",en:"3 people and above follow the regular nin pattern"},
    {jp:"よにん (4人)",rom:"yo-nin",en:"4 people - always use yo never shi"}
  ]},
  {title:"Asking the price",color:"amber",phrases:[
    {jp:"すみません。いくらですか？",rom:"Sumimasen. Ikura desuka?",en:"Excuse me, how much is it?",role:"you"},
    {jp:"〇〇えんです。",rom:"... en desu.",en:"It is ___ yen.",note:"Listen for the number!",role:"staff"}
  ]}
]},
{id:"greetings",tab:"Greetings",title:"Everyday Greetings",sub:"Essential greetings, expressions, and meal phrases",sections:[
  {title:"Daily greetings",color:"",phrases:[
    {jp:"おはようございます",rom:"Ohayou gozaimasu",en:"Good morning",note:"Use before about 10am"},
    {jp:"こんにちは",rom:"Konnichiwa",en:"Hello / Good afternoon"},
    {jp:"こんばんは",rom:"Konbanwa",en:"Good evening"},
    {jp:"げんきですか？",rom:"Genki desuka?",en:"How are you?"},
    {jp:"げんきです！",rom:"Genki desu!",en:"I am good! I am well!"},
    {jp:"ありがとうございます",rom:"Arigatou gozaimasu",en:"Thank you very much"},
    {jp:"すみません",rom:"Sumimasen",en:"Excuse me Sorry - very versatile!"},
    {jp:"おねがいします",rom:"Onegaishimasu",en:"Please / I would like this"},
    {jp:"じゃあね / またね",rom:"Jaa ne / Mata ne",en:"See you Bye casual"},
    {jp:"おやすみなさい",rom:"Oyasuminasai",en:"Good night"}
  ]},
  {title:"Meal expressions",color:"amber",phrases:[
    {jp:"いただきます",rom:"Itadakimasu",en:"Thank you for the meal said before eating",note:"Say before every meal!"},
    {jp:"ごちそうさまでした",rom:"Gochisousamadeshita",en:"Thank you for the meal said after eating",note:"Say when you finish - staff will appreciate it!"}
  ]},
  {title:"Situational dialogue - Meeting someone",color:"",phrases:[
    {jp:"おはようございます！げんきですか？",rom:"Ohayou gozaimasu! Genki desuka?",en:"Good morning! How are you?",role:"you"},
    {jp:"げんきです！ドノバンさんは？",rom:"Genki desu! Donoban-san wa?",en:"I am well! How about you Donovan?",role:"staff"},
    {jp:"わたしも げんきです。ありがとうございます！",rom:"Watashi mo genki desu. Arigatou gozaimasu!",en:"I am well too. Thank you!",role:"you"}
  ]}
]},
{id:"intro",tab:"Introduction",title:"Self Introduction",sub:"Build and practice your full introduction",sections:[
  {title:"Introduction building blocks",color:"",phrases:[
    {jp:"わたしは〇〇です。",rom:"Watashi wa [name] desu.",en:"I am [name].",note:"Replace the circle with your name"},
    {jp:"アメリカじんです。",rom:"Amerikajin desu.",en:"I am American.",note:"country + jin = nationality"},
    {jp:"ケンタッキーからきました。",rom:"Kentakkii kara kimashita.",en:"I am from Kentucky.",note:"kara = from, kimashita = came"},
    {jp:"スポーツが すきです。",rom:"Supootsu ga suki desu.",en:"I like sports."},
    {jp:"おんがくが すきです。",rom:"Ongaku ga suki desu.",en:"I like music."},
    {jp:"ビデオゲームが すきです。",rom:"Bideo geemu ga suki desu.",en:"I like video games."},
    {jp:"よろしくおねがいします。",rom:"Yoroshiku onegaishimasu.",en:"Nice to meet you! Please take care of me.",note:"Always end introductions with this"}
  ]},

// ── Voice setup ──────────────────────────────────────────────────
let jpVoice=null,enVoice=null,currentSpeed=0.85,isPlayingAll=false;
function loadVoices(){
  const voices=window.speechSynthesis.getVoices();
  if(!voices.length)return;
  const jpSel=document.getElementById("jpVoice");
  const enSel=document.getElementById("enVoice");
  jpSel.innerHTML="";enSel.innerHTML="";
  const jpV=voices.filter(v=>v.lang.startsWith("ja"));
  const enV=voices.filter(v=>v.lang.startsWith("en"));
  jpV.forEach((v,i)=>{const o=document.createElement("option");o.value=i;o.textContent=v.name;jpSel.appendChild(o);});
  enV.forEach((v,i)=>{const o=document.createElement("option");o.value=i;o.textContent=v.name;enSel.appendChild(o);});
  jpVoice=jpV[0]||null;
  enVoice=enV[0]||null;
  jpSel.onchange=()=>{jpVoice=jpV[jpSel.value];};
  document.getElementById("voiceStatus").textContent=jpVoice?"Japanese voice ready":"No Japanese voice - install Japanese in device settings";
}
window.speechSynthesis.onvoiceschanged=loadVoices;
loadVoices();

function cleanForSpeech(text){
  return text.replace(/[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]/g,"").replace(/[○✕×◎]/g,"").replace(/【|】/g,"").replace(/^[\s・\-]+/,"").trim();
}

function speak(text,onEnd){
  window.speechSynthesis.cancel();
  const utt=new SpeechSynthesisUtterance(cleanForSpeech(text));
  utt.voice=jpVoice;utt.lang="ja-JP";utt.rate=currentSpeed;utt.pitch=1.0;
  utt.onend=onEnd||null;
  window.speechSynthesis.speak(utt);
}

function speakPhrase(jp,en,btnEl){
  stopAll();
  document.getElementById("npJp").textContent=jp;
  document.getElementById("npEn").textContent=en;
  document.getElementById("nowPlaying").classList.add("visible");
  if(btnEl){btnEl.textContent="||";btnEl.classList.add("playing");}
  speak(jp,()=>{
    if(btnEl){btnEl.textContent=">>";btnEl.classList.remove("playing");}
    document.getElementById("nowPlaying").classList.remove("visible");
  });
}

function stopAll(){
  window.speechSynthesis.cancel();isPlayingAll=false;
  document.getElementById("nowPlaying").classList.remove("visible");
  document.querySelectorAll(".play-btn").forEach(b=>{b.textContent=">>";b.classList.remove("playing");});
  document.querySelectorAll(".play-all-btn").forEach(b=>{b.textContent="Play All";b.classList.remove("stop");b.onclick=()=>playAll(b.dataset.unit);});
  const p=document.getElementById("progressText");if(p)p.textContent="";
}

function playAll(unitId){
  stopAll();
  const unit=units.find(u=>u.id===unitId);if(!unit)return;
  const allPhrases=unit.sections.flatMap(s=>(s.phrases||[]));
  isPlayingAll=true;
  const btn=document.getElementById("play-all-"+unitId);
  if(btn){btn.textContent="Stop";btn.classList.add("stop");btn.onclick=stopAll;}
  let i=0;
  function playNext(){
    if(!isPlayingAll||i>=allPhrases.length){stopAll();return;}
    const p=allPhrases[i];
    if(!p.jp){i++;setTimeout(playNext,200);return;}
    const prog=document.getElementById("progressText");
    if(prog)prog.textContent=(i+1)+" / "+allPhrases.length;
    document.getElementById("npJp").textContent=p.jp;
    document.getElementById("npEn").textContent=p.en;
    document.getElementById("nowPlaying").classList.add("visible");
    speak(p.jp,()=>{if(!isPlayingAll)return;i++;setTimeout(playNext,900);});
  }
  playNext();
}

function setSpeed(rate){
  currentSpeed=rate;
  document.querySelectorAll(".speed-btn").forEach(b=>{
    b.classList.toggle("active",
      (rate===0.65&&b.textContent==="Slow")||
      (rate===0.85&&b.textContent==="Normal")||
      (rate===1.0&&b.textContent==="Fast"));
  });
}

function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML="";
  units.forEach((u,i)=>{
    const t=document.createElement("div");
    t.className="tab"+(i===0?" active":"");
    t.textContent=u.tab;t.onclick=()=>switchTab(u.id);
    el.appendChild(t);
  });
  applyCatFilter();
}

function switchTab(unitId){
  if(!units.some(u=>u.id===unitId))unitId="home";
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("active",!!units[i]&&units[i].id===unitId));
  document.querySelectorAll(".unit").forEach(u=>u.classList.toggle("active",u.id==="unit-"+unitId));
  rememberTab(unitId);
  stopAll();
}

function esc(s){
  return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;");
}

// ── Star / favorite system (persisted in localStorage) ──────────
function loadStars(){
  try{
    const raw=localStorage.getItem(K.stars);
    return raw?JSON.parse(raw):[];
  }catch(e){return [];}
}
function saveStars(arr){
  try{localStorage.setItem(K.stars,JSON.stringify(arr));}catch(e){}
}
function isStarred(unitId,jp){
  return loadStars().some(s=>s.unitId===unitId && s.jp===jp);
}
function starBtnHtml(unitId,jp,en,rom,extraClass){
  if(!unitId)return "";
  const starred=isStarred(unitId,jp);
  const cls=(extraClass||"star-btn")+(starred?" starred":"");
  return `<button class="${cls}" onclick="event.stopPropagation();toggleStar(this,'${unitId}','${esc(jp)}','${esc(en||"")}','${esc(rom||"")}')">${starred?"&#9733;":"&#9734;"}</button>`;
}
function toggleStar(btn,unitId,jp,en,rom){
  let stars=loadStars();
  const idx=stars.findIndex(s=>s.unitId===unitId && s.jp===jp);
  if(idx>=0){
    stars.splice(idx,1);
    btn.classList.remove("starred");
    btn.innerHTML="&#9734;";
  } else {
    stars.push({unitId,jp,en,rom});
    btn.classList.add("starred");
    btn.innerHTML="&#9733;";
  }
  saveStars(stars);
  refreshStarReviewWrap(unitId);
}
function refreshStarReviewWrap(unitId){
  const el=document.getElementById("star-review-wrap-"+unitId);
  if(el)el.innerHTML=buildStarReviewInner(unitId);
}
function buildStarReviewInner(unitId){
  const items=loadStars().filter(s=>s.unitId===unitId);
  if(!items.length)return "";
  return `<div class="star-review-card">
    <div class="star-review-header">
      <span class="star-review-title">&#9733; Starred in this section</span>
      <span class="star-review-count">${items.length} item${items.length===1?"":"s"}</span>
    </div>
    <div class="star-review-chips">${items.map(it=>`<span class="star-chip">${it.jp}</span>`).join("")}</div>
    <button class="star-review-btn" onclick="startStarReview('${unitId}')">Review as Flashcards</button>
    <div id="star-review-session-${unitId}"></div>
  </div>`;
}

const starReviewSessions={};
function startStarReview(unitId){
  const items=shuffleArr(loadStars().filter(s=>s.unitId===unitId));
  starReviewSessions[unitId]={items,index:0,known:0,review:0,flipped:false};
  renderStarReviewSession(unitId);
}
function renderStarReviewSession(unitId){
  const s=starReviewSessions[unitId];
  const wrap=document.getElementById("star-review-session-"+unitId);
  if(!wrap)return;
  if(!s || s.index>=s.items.length){
    if(s && s.items.length){
      wrap.innerHTML=`<div class="star-session-done">Reviewed ${s.items.length} item${s.items.length===1?"":"s"} &middot; ${s.known} known, ${s.review} still learning.
        <button class="star-review-btn" onclick="${unitId==="saved"?"startSavedReview()":"startStarReview('"+unitId+"')"}">Review Again</button></div>`;
    } else {
      wrap.innerHTML="";
    }
    return;
  }
  const item=s.items[s.index];
  let html=`<div class="star-flip-card${s.flipped?" flipped":""}" onclick="flipStarCard('${unitId}')">
    <div class="star-flip-progress">${s.index+1} / ${s.items.length}</div>
    <div class="star-flip-front">${item.en}</div>`;
  if(s.flipped){
    html+=`<div class="star-flip-back">
      <div class="star-flip-jp">${item.jp}</div>
      <div class="star-flip-rom">${item.rom||""}</div>
      <button class="star-flip-play" onclick="event.stopPropagation();speakPhrase('${esc(item.jp)}','${esc(item.en)}',this)">&gt;&gt;</button>
    </div>`;
  } else {
    html+=`<div class="star-flip-hint">Tap to reveal</div>`;
  }
  html+=`</div>`;
  if(s.flipped){
    html+=`<div class="star-flip-actions">
      <button class="star-flip-btn learning" onclick="answerStarCard('${unitId}',false)">Still Learning</button>
      <button class="star-flip-btn known" onclick="answerStarCard('${unitId}',true)">Got It</button>
    </div>`;
  }
  wrap.innerHTML=html;
}
function flipStarCard(unitId){
  const s=starReviewSessions[unitId];
  if(!s)return;
  s.flipped=true;
  renderStarReviewSession(unitId);
}
function answerStarCard(unitId,known){
  const s=starReviewSessions[unitId];
  if(!s)return;
  if(known)s.known++; else s.review++;
  s.index++;
  s.flipped=false;
  renderStarReviewSession(unitId);
}

// ── Phrase-type detection & renderers (table / chat / conjugation) ──
function phraseType(p){
  if(p.jp && p.jp.indexOf("→")!==-1) return "conj";
  if(p.role) return "chat";
  return "vocab";
}

function renderPhraseRuns(phrases,unitId){
  let html="";
  let i=0;
  while(i<phrases.length){
    const type=phraseType(phrases[i]);
    const run=[];
    while(i<phrases.length && phraseType(phrases[i])===type){run.push(phrases[i]);i++;}
    if(type==="vocab") html+=renderVocabTable(run,unitId);
    else if(type==="chat"){
      const roles=new Set(run.map(p=>p.role));
      if(roles.size>1){
        html+=renderChatThread(run,unitId);
      } else {
        html+=renderVocabTable(run,unitId);
      }
    }
    else html+=renderConjGrid(run,unitId);
  }
  return html;
}

function renderVocabTable(phrases,unitId){
  let html='<div class="vocab-table">';
  phrases.forEach(p=>{
    html+=`<div class="vocab-row" data-skey="${esc(unitId+"::"+p.jp)}" onclick="speakPhrase('${esc(p.jp)}','${esc(p.en)}',this.querySelector('.vocab-play'))">
      <div class="vocab-main">
        <div class="vocab-jp">${p.hl||p.jp}</div>
        <div class="vocab-sub"><span class="vocab-rom">${p.rom||""}</span><span class="vocab-en">${p.en||""}</span></div>
        ${p.note?`<div class="vocab-note">* ${p.note}</div>`:""}
      </div>
      <div class="vocab-actions">
        ${starBtnHtml(unitId,p.jp,p.en,p.rom)}
        <button class="vocab-play" onclick="event.stopPropagation();speakPhrase('${esc(p.jp)}','${esc(p.en)}',this)">&gt;&gt;</button>
      </div>
    </div>`;
  });
  html+='</div>';
  return html;
}

function renderChatThread(phrases,unitId){
  let html='<div class="chat-thread">';
  phrases.forEach(p=>{
    const role=p.role==="staff"?"staff":"you";
    const label=p.role==="staff"?"Staff":"You";
    html+=`<div class="chat-row ${role}">
      <div class="chat-bubble" data-skey="${esc(unitId+"::"+p.jp)}" onclick="speakPhrase('${esc(p.jp)}','${esc(p.en)}',this.querySelector('.chat-play-inline'))">
        <div class="chat-label">${label}</div>
        <div class="chat-jp">${p.hl||p.jp}<span class="chat-play-inline">&gt;&gt;</span>${starBtnHtml(unitId,p.jp,p.en,p.rom,"chat-star")}</div>
        <div class="chat-rom">${p.rom||""}</div>
        <div class="chat-en">${p.en||""}</div>
        ${p.note?`<div class="chat-note">* ${p.note}</div>`:""}
      </div>
    </div>`;
  });
  html+='</div>';
  return html;
}

function renderKosoadoTable(cfg,unitId){
  if(!cfg)return "";
  let html='<div class="kosoado-wrap"><div class="kosoado-table">';
  html+='<div class="kosoado-cell kosoado-corner"></div>';
  cfg.columns.forEach(col=>{
    html+=`<div class="kosoado-cell kosoado-head ${col.key}">${col.label}<span class="kosoado-head-jp">${col.kana}</span></div>`;
  });
  cfg.rows.forEach(row=>{
    html+=`<div class="kosoado-cell kosoado-row-label">${row.label}${row.sub?`<span class="kosoado-row-sub">${row.sub}</span>`:""}</div>`;
    cfg.columns.forEach(col=>{
      const cell=row.cells[col.key];
      if(!cell){html+='<div class="kosoado-cell kosoado-data"></div>';return;}
      html+=`<div class="kosoado-cell kosoado-data ${col.key}" data-skey="${esc(unitId+"::"+cell.jp)}" onclick="speakPhrase('${esc(cell.jp)}','${esc(cell.en)}',null)">
        ${starBtnHtml(unitId,cell.jp,cell.en,cell.rom,"num-star")}
        <div class="kosoado-jp">${cell.jp}</div>
        <div class="kosoado-rom">${cell.rom}</div>
        <div class="kosoado-en">${cell.en}</div>
      </div>`;
    });
  });
  html+='</div></div>';
  return html;
}

function renderGrammarCard(phrases,unitId){
  if(!phrases.length)return "";
  const rule=phrases[0];
  const examples=phrases.slice(1);
  let html=`<div class="grammar-card">
    <div class="grammar-rule-row" data-skey="${esc(unitId+"::"+rule.jp)}" onclick="speakPhrase('${esc(rule.jp)}','${esc(rule.en)}',this.querySelector('.grammar-rule-play'))">

    </div>`;
  if(examples.length){
    html+=`<div class="grammar-examples-label">Examples</div><div class="grammar-examples">`;
    examples.forEach(ex=>{
      html+=`<div class="grammar-ex-row" data-skey="${esc(unitId+"::"+ex.jp)}" onclick="speakPhrase('${esc(ex.jp)}','${esc(ex.en)}',this.querySelector('.grammar-ex-play'))">

function renderNumberGrid(phrases,unitId,extraClass){
  let html=`<div class="num-grid ${extraClass||""}">`;
  phrases.forEach(p=>{
    const speakText=p.reading||p.jp;
    html+=`<div class="num-cell" data-skey="${esc(unitId+"::"+p.jp)}" onclick="speakPhrase('${esc(speakText)}','${esc(p.en)}',null)">
      ${starBtnHtml(unitId,p.jp,p.en,p.rom,"num-star")}
      <div class="num-jp">${p.jp}</div>
      <div class="num-rom">${p.rom||""}</div>
      ${p.en?`<div class="num-en">${p.en}</div>`:""}
      ${p.note?`<div class="num-note">${p.note}</div>`:""}
    </div>`;
  });
  html+="</div>";
  return html;

function renderConjGrid(phrases,unitId){
  let html='<div class="conj-grid">';
  phrases.forEach(p=>{
    const jpParts=p.jp.split("→").map(s=>s.trim());
    const romParts=(p.rom||"").split(" - ").map(s=>s.trim()).filter(Boolean);
    const speakText=jpParts.join(" ");
    let chipsHtml="";
    jpParts.forEach((part,idx)=>{
      const isLast=idx===jpParts.length-1;
      chipsHtml+=`<span class="conj-chip ${isLast?"target":"base"}">${part}</span>`;
      if(!isLast)chipsHtml+=`<span class="conj-arrow">&#8594;</span>`;
    });
    const romLine=romParts.join(" &rarr; ");
    html+=`<div class="conj-card" data-skey="${esc(unitId+"::"+p.jp)}" onclick="speakPhrase('${esc(speakText)}','${esc(p.en)}',this.querySelector('.conj-play'))">
      <div class="conj-row">${chipsHtml}
        ${starBtnHtml(unitId,p.jp,p.en,p.rom,"conj-star")}
        <button class="conj-play" onclick="event.stopPropagation();speakPhrase('${esc(speakText)}','${esc(p.en)}',this)">&gt;&gt;</button>
      </div>
      ${romLine?`<div class="conj-rom">${romLine}</div>`:""}
      <div class="conj-en">${p.en||""}</div>
      ${p.note?`<div class="conj-note">* ${p.note}</div>`:""}
    </div>`;
  });
  html+='</div>';
  return html;
}

function renderUnits(){
  const content=document.getElementById("content");
  units.forEach(unit=>{
    const div=document.createElement("div");
    div.className="unit"+(unit.id===units[0].id?" active":"");
    div.id="unit-"+unit.id;
    if(["__KANA__","__QUIZ__","__TRANSLATE__","__SAVED__","__CONJUGATOR__","__BUILDER__","__DRILL__","__HOME__","__RECORDER__"].indexOf(unit.title)!==-1){content.appendChild(div);return;}

    let html=`<div class="unit-title">${unit.title}</div>
      <div class="unit-sub">${unit.sub}</div>
      <div class="play-all-bar">
        <button class="play-all-btn" id="play-all-${unit.id}" data-unit="${unit.id}" onclick="playAll('${unit.id}')">Play All</button>
        <span class="speed-label">Speed:</span>
        <button class="speed-btn" onclick="setSpeed(0.65)">Slow</button>
        <button class="speed-btn active" onclick="setSpeed(0.85)">Normal</button>
        <button class="speed-btn" onclick="setSpeed(1.0)">Fast</button>
        <span class="progress-text" id="progressText"></span>
      </div>`;

    unit.sections.forEach(sec=>{
      if(sec.header){html+=`<div class="group-header">${sec.title}</div>`;return;}
      const c=sec.color||"";
      html+=`<div class="section-divider ${c}">${sec.title}</div>`;
      if(sec.infoCards){
        sec.infoCards.forEach(card=>{
          html+=`<div class="info-card ${card.style}">
            <div class="info-card-title">${card.heading}</div>
            <div class="info-card-body">${card.body}</div>
          </div>`;
        });
      }
      const phrases=sec.phrases||[];
      if(sec.layout==="lesson"){
        html+=renderLessonSection(sec,unit.id);
      } else if(sec.layout==="kosoado"){
        html+=renderKosoadoTable(sec.kosoado,unit.id);
      } else if(sec.layout==="grammar"){
        html+=renderGrammarCard(phrases,unit.id);
      } else if(sec.grid){
        html+=renderNumberGrid(phrases, unit.id, sec.grid==="kanji"?"kanji-grid":"");
      } else {
        html+=renderPhraseRuns(phrases,unit.id);
      }
    });
    html+=`<div id="star-review-wrap-${unit.id}">${buildStarReviewInner(unit.id)}</div>`;
    div.innerHTML=html;
    content.appendChild(div);
  });
}

  }

}

function shuffleArr(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const tmp=a[i];a[i]=a[j];a[j]=tmp;
  }
  return a;
}

let searchIndex=[];
let currentSearchResults=[];

function buildSearchIndex(){
  const idx=[];
  units.forEach(unit=>{
    if(unit.id==="quiz")return;
    (unit.sections||[]).forEach(sec=>{
      if(sec.layout==="kosoado" && sec.kosoado){
        sec.kosoado.rows.forEach(row=>{
          sec.kosoado.columns.forEach(col=>{
            const cell=row.cells[col.key];
            if(cell){
              idx.push({unitId:unit.id,unitTab:unit.tab,sectionTitle:sec.title,jp:cell.jp,rom:cell.rom||"",en:cell.en||"",note:""});
            }
          });
        });
      }
      if(sec.table&&sec.table.speak!==undefined){
        sec.table.rows.forEach(r=>{
          const cell=String(r[sec.table.speak]).split("|");
          const enc=sec.table.en!==undefined?String(r[sec.table.en]).split("|")[0]:"";
          idx.push({unitId:unit.id,unitTab:unit.tab,sectionTitle:sec.title,jp:stripMarkup(cell[0]),rom:cell[1]||"",en:stripMarkup(enc),note:""});
        });
      }
      (sec.phrases||[]).forEach(p=>{
        if(!p.jp)return;
        idx.push({unitId:unit.id,unitTab:unit.tab,sectionTitle:sec.title,jp:p.jp,rom:p.rom||"",en:p.en||"",note:p.note||""});
      });
    });
  });
  if(typeof KANA_QUIZ_ITEMS!=="undefined"){
    KANA_QUIZ_ITEMS.forEach(k=>{
      idx.push({unitId:"kana",unitTab:"Hiragana and Katakana",sectionTitle:"Kana chart",jp:k.c,rom:k.r,en:k.r,note:""});
    });
  }
  loadSaved().forEach(s=>{
    idx.push({unitId:"saved",unitTab:"Saved Phrases",sectionTitle:"Saved",jp:s.jp,rom:s.rom||"",en:s.en||"",note:s.note||""});
  });
  searchIndex=idx;
}

function performSearch(q){
  const ql=q.toLowerCase();
  return searchIndex.filter(item=>
    item.jp.indexOf(q)!==-1 ||
    (item.rom && item.rom.toLowerCase().indexOf(ql)!==-1) ||
    (item.en && item.en.toLowerCase().indexOf(ql)!==-1) ||
    (item.note && item.note.toLowerCase().indexOf(ql)!==-1)
  );
}

function handleSearchInput(){
  const input=document.getElementById("searchInput");
  const clearBtn=document.getElementById("searchClearBtn");
  const q=input.value.trim();

function renderSearchResults(results,q){
  const wrap=document.getElementById("searchResults");
  if(!results.length){
    wrap.innerHTML=`<div class="search-empty">No matches for "${esc(q)}"</div>`;
    wrap.classList.add("show");
    currentSearchResults=[];

  }
  const LIMIT=40;
  const shown=results.slice(0,LIMIT);
  let html="";
  shown.forEach((r,i)=>{
    html+=`<div class="search-result-row" onclick="goToSearchResult(${i})">
      <div class="search-result-main">
        <div class="search-result-jp">${escHtml(r.jp)}</div>
        <div class="search-result-en">${r.rom?`<span class="rom-inline">${escHtml(r.rom)} &middot; </span>`:""}${escHtml(r.en)}</div>
      </div>
      <span class="search-result-tag">${r.unitTab}</span>
    </div>`;
  });
  if(results.length>LIMIT){
    html+=`<div class="search-more">Showing ${LIMIT} of ${results.length} matches - keep typing to narrow it down</div>`;
  }
  wrap.innerHTML=html;
  wrap.classList.add("show");
  currentSearchResults=shown;
